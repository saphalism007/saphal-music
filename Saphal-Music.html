The long **neck** runs from the body to the **headstock**, where the **tuning pegs** tighten or loosen each string. Where the neck meets the headstock, the strings cross the **nut**, a small grooved strip that keeps them spaced.

The front of the neck is the **fretboard**. The metal strips across it are **frets**. Pressing a string just behind a fret shortens the part that vibrates, and the note goes up. Each fret raises the note by one semitone, the smallest step in western music.`},{kind:"fretboard",from:0,to:5,caption:"The first five frets, as the app draws them. The thick light bar is the nut. Tap anywhere to hear that string at that fret."},{kind:"tip",title:"Acoustic, classical or electric?",text:"Everything here works on any of them. Classical guitars have nylon strings and wider necks, which are softer on the fingers. Steel string acoustics and electrics are brighter and the strings are thinner."}],ready:["You can point to the nut, a fret, the bridge and a tuning peg without thinking."],words:"anatomy body neck headstock nut saddle bridge frets fretboard tuning pegs"},{id:"g1-hold",instrument:It,stage:1,title:"Holding it, sitting and standing",summary:"A posture that lets both hands move freely.",why:"Most early aches, and a surprising number of buzzing notes, come from how the guitar is held, not from the fingers.",blocks:[{kind:"steps",items:["Sit on a chair without arms, near the front edge, back straight but not stiff, both feet flat.","Rest the waist of the guitar (the curve in the body) on your right thigh. The neck points to the left and slightly up, about the height of your left shoulder.","Lay your right forearm over the top edge of the body so the hand falls naturally over the strings between the sound hole and the bridge.","Your left hand should not be holding the guitar up. If you take the left hand away, the guitar should stay where it is.","Tilt the guitar back only slightly. You should be able to see the top edge of the fretboard by leaning your head a little, not by tipping the guitar towards you."]},{kind:"text",text:"**Standing**: use a strap and set it so the guitar sits at the same height as when you are sitting. If it hangs much lower, the left wrist has to bend sharply and everything gets harder."},{kind:"tip",title:"Classical position",text:"Classical players rest the guitar on the left thigh, raised with a footstool or support, with the neck higher. It gives the left hand the best reach. Try both and use whichever feels freer."}],mistakes:["Hunching over to look at the fretboard. Look with your eyes, not your whole spine.","Gripping the neck to hold the guitar up.","The guitar sliding down so the neck points at the floor."],words:"posture sitting standing strap how to hold"},{id:"g1-strings",instrument:It,stage:1,title:"String names and numbers",summary:"E A D G B E, and why the thinnest string is number 1.",why:"Every chord diagram, every piece of tab and every lesson talks about strings by name or by number.",blocks:[{kind:"text",text:`From the thickest string, nearest your face, to the thinnest: **E A D G B E**. A phrase helps: Every Amateur Does Get Better Eventually.

The strings are also numbered, and the numbering runs the other way. The thinnest string, the high e, is **string 1**. The thickest, the low E, is **string 6**. So the B string is 2, G is 3, D is 4, A is 5.

The two E strings are both E, two octaves apart. To tell them apart, people say low E and high e.`},{kind:"fretboard",from:0,to:4,marks:[{s:6,f:0,label:"E",role:"root"},{s:5,f:0,label:"A"},{s:4,f:0,label:"D"},{s:3,f:0,label:"G"},{s:2,f:0,label:"B"},{s:1,f:0,label:"e",role:"root"}],caption:"Tap each open string to hear it, from the low E up."},{kind:"exercise",id:"g-open-down"}],ready:["You can name every open string from memory, in both directions.","When someone says string 4, you know it is the D string."],words:"string names numbers eadgbe open strings"},{id:"g1-tuning",instrument:It,stage:1,title:"Tuning to standard EADGBE",summary:"With the tuner, and by ear with the fifth fret method.",why:"An out of tune guitar makes correct playing sound wrong, which is the most discouraging thing that can happen to a beginner. Tune every time you pick it up.",blocks:[{kind:"text",text:`**With the tuner.** Open Practice, then Tuner. Play one open string and let it ring. The needle shows how far you are from the nearest note. Turn that string's peg slowly until the needle sits in the middle. If the note shown is not the one you want, the string is a long way out; keep turning in the right direction.

Always tune **up** to the note. If you are sharp, go a little below and come back up. Strings settle better that way and stay in tune longer.`},{kind:"text",text:"**By ear, the fifth fret method.** Once the low E is right, every other string can be tuned from the one below it:"},{kind:"steps",items:["Fret 5 on the low E string is an A. Play it, then play the open A string. Turn the A string until the two sound the same.","Fret 5 on the A string is a D. Tune the open D string to it.","Fret 5 on the D string is a G. Tune the open G string to it.","Here is the exception: fret 4 on the G string is a B. Tune the open B string to it.","Fret 5 on the B string is an E. Tune the high e to it."]},{kind:"fretboard",from:0,to:6,marks:[{s:6,f:5,label:"A"},{s:5,f:0,label:"A",role:"root"},{s:5,f:5,label:"D"},{s:4,f:0,label:"D",role:"root"},{s:4,f:5,label:"G"},{s:3,f:0,label:"G",role:"root"},{s:3,f:4,label:"B"},{s:2,f:0,label:"B",role:"root"},{s:2,f:5,label:"E"},{s:1,f:0,label:"E",role:"root"}],caption:"Each pair should sound identical. Tap one, then the other."},{kind:"tip",title:"Hearing whether two notes match",text:"When two notes are close but not the same you hear a slow wobble, a beating. Turn the peg so the wobble slows down. When it stops completely, the string is in tune."}],mistakes:["Turning the wrong peg. Follow the string from the nut to its peg before you turn.","Turning far too quickly. A quarter turn changes the pitch a lot.","Tuning down to the note instead of up to it."],ready:["You can tune all six strings with the tuner in under three minutes."],words:"tuning tune tuner standard tuning fifth fret method relative tuning"},{id:"g1-diagrams",instrument:It,stage:1,title:"Reading a chord diagram",summary:"Strings up and down, frets across, dots for fingers.",why:"Chord diagrams are how every guitarist shares chords. Once you can read one, you can learn any chord on your own.",blocks:[{kind:"text",text:`Imagine the guitar standing upright in front of you, facing you. The six vertical lines are the strings, **low E on the left**, high e on the right. The thick line at the top is the nut. The horizontal lines are frets.

A **dot** shows where to press, and the number in it is the finger: 1 index, 2 middle, 3 ring, 4 little. An **o** above a string means play it open. An **x** means do not play it at all.

In this app the root of the chord, the note it is named after, is drawn in the accent colour. When a shape is higher up the neck, the diagram says which fret it starts on, for example 5fr.`},{kind:"chords",ids:["E-m","D-maj","F-maj"],caption:"Tap a diagram to hear the chord. E minor uses all six strings, D only the top four, and this F has crosses on two strings."}],ready:["You can look at a diagram and place the right fingers without help."],words:"chord diagram chart chord box read"},{id:"g1-tab",instrument:It,stage:1,title:"Reading tab",summary:"Six lines, one per string, and numbers for frets.",why:"Most guitar music you will meet is written as tab. It tells you exactly where to put your fingers.",blocks:[{kind:"text",text:`Tab has six lines, one per string, laid out the way you see the strings when you look down at the guitar in your lap: the **top line is the high e**, the bottom line is the low E. This is upside down compared with a chord diagram, and catches everyone out at first.

A number on a line is the fret to press on that string. 0 is the open string. Numbers stacked on top of each other are played together.

Plain tab does not show rhythm well, so in this app every exercise also plays back with a metronome, and the numbers under the tab count the beats.`},{kind:"exercise",id:"g-tab-tune"}],mistakes:["Reading the top line as the low E. Top line, thinnest string."],ready:["You can play the first tab tune at 60 bpm without stopping."],words:"tab tablature read tabs"},{id:"g1-fingers",instrument:It,stage:1,title:"Finger numbers and pressing cleanly",summary:"Where to press, how hard, and where the thumb goes.",why:"A clean note is the basic unit of everything. Get this right now and every chord later is easier.",blocks:[{kind:"text",text:`Left hand fingers are numbered **1 index, 2 middle, 3 ring, 4 little**. The thumb is not numbered on guitar; it sits behind the neck, roughly behind finger 2.

Press with the **tip** of the finger, as close as you can to the fret wire without being on top of it. Close to the wire, very little pressure is needed. In the middle of the gap, much more is needed and the note may buzz.

Press only as hard as it takes to get a clean note. Try this: press so lightly the note buzzes, then add pressure bit by bit until it just rings. That is enough. Anything more is wasted effort that tires the hand.`},{kind:"fretboard",from:0,to:5,marks:[{s:6,f:1,finger:1},{s:6,f:2,finger:2},{s:6,f:3,finger:3},{s:6,f:4,finger:4}],caption:"One finger per fret: the basic position of the left hand."},{kind:"exercise",id:"g-onestring"}],method:["Play each note four times before moving to the next.","If a note buzzes, do not play on. Stop, move the finger nearer the fret, and try that note again.","Your fingertips will be sore for the first two weeks. Practise often and briefly, ten minutes a few times a day, rather than one long session."],mistakes:["Pressing in the middle of the fret, which buzzes.","The thumb squeezing hard from behind. It should only balance the fingers.","The wrist collapsing so the palm touches the neck."],ready:["Four clean notes on every string with fingers 1 to 4."],theory:[],words:"finger numbers pressing buzz clean notes left hand thumb"},{id:"g1-pick",instrument:It,stage:1,title:"Holding a pick",summary:"A relaxed grip and your first downstrokes.",why:"The pick turns the movement of your hand into sound. A relaxed grip gives an even tone and lets you play faster later.",kind:"technique",blocks:[{kind:"steps",items:["Curl your index finger. Lay the pick on the side of its first joint, pointing towards the strings.","Put your thumb flat on top. Only a few millimetres of the tip should show.","Hold it just firmly enough that it does not turn in your fingers when it hits the string.","Let the movement come from the wrist, like flicking water off your fingertips, not from the elbow."]},{kind:"tip",title:"Which pick?",text:"A medium pick, about 0.7 mm, suits both strumming and single notes. Very thin picks flap; very thick ones feel stiff at first."},{kind:"exercise",id:"g-open-down"}],mistakes:["Too much pick showing, so it catches the strings.","Gripping hard enough to whiten the fingertips.","Playing from the elbow, which makes strokes big and slow."],words:"pick plectrum grip hold downstroke right hand"},{id:"g1-walk",instrument:It,stage:1,title:"The finger walk",summary:"1 2 3 4 on every string. Your first daily exercise.",why:"This simple pattern trains finger independence, clean fretting and moving across strings, all at once. Guitarists of every level use versions of it to warm up.",blocks:[{kind:"exercise",id:"g-spider"},{kind:"text",text:"Play it with downstrokes for now. In stage 4 you will play the same walk with alternate picking in eighth notes, and that version is the heart of the hand synchronisation work."}],method:["Start at a tempo where you can play every note cleanly. For most people that is 50 or slower.","Play for one minute, then judge honestly with the buttons below the exercise. The app moves the tempo for you.","Two or three minutes a day is plenty. Every day beats once a week."],mistakes:["Fingers flying far from the strings between notes.","Looking at the picking hand instead of listening."],ready:["1 2 3 4 on every string at 60 bpm with no buzzing notes."],words:"spider exercise chromatic warm up finger independence"},{id:"g2-em",instrument:It,stage:2,title:"Your first chord: E minor",summary:"Two fingers, six strings, and a big full sound.",why:"E minor is the easiest chord on the guitar, which makes it perfect for learning what a chord should feel and sound like when everything is right.",blocks:[{kind:"chords",ids:["E-m"]},{kind:"steps",items:["Finger 2 on the A string, fret 2.","Finger 3 on the D string, fret 2, right next to it.","Strum all six strings with a downstroke.","Now check it: pick each string one at a time, from the low E to the high e. Every string should ring clearly."]},{kind:"fretboard",chord:"E-m",caption:"The same chord on the neck. The accent coloured notes are E, the root."},{kind:"progression",instrument:"guitar",chords:["E-m"],beats:4,bpm:60,pattern:"1",caption:"Strum on every click. Four downstrokes per bar."}],method:["Place the fingers, strum, take them off completely, shake out the hand, and place them again. Do this ten times. You are training the hand to land on the shape, not just to hold it."],mistakes:["Finger 3 leaning on the G string, which mutes it. Arch the finger.","Pressing much harder than needed."],ready:["Every string rings when you pick them one by one."],words:"e minor em first chord"},{id:"g2-am",instrument:It,stage:2,title:"A minor, and your first change",summary:"Am, and moving between Em and Am.",why:"Playing chords is easy. Changing between them in time is the real skill, and it starts here.",blocks:[{kind:"chords",ids:["A-m","E-m"]},{kind:"text",text:`A minor uses the same shape as E major, just moved across one string. Do not strum the low E.

To change from Em to Am, notice that fingers 2 and 3 only need to move across one string each, and finger 1 drops onto the B string. Move all the fingers **at the same time**, as one shape, not one after the other.`},{kind:"progression",instrument:"guitar",chords:["E-m","A-m"],beats:4,bpm:60,pattern:"1"}],method:["Practise the change in silence first: Em shape, then Am shape, then Em, without strumming. Ten times, slowly.","Then with the backing at 60. If you cannot change in time, strum only beat 1 of each bar and use the other three beats to move."],mistakes:["Strumming the low E on Am.","Lifting the fingers high in the air between chords."],words:"a minor am change"},{id:"g2-e-a",instrument:It,stage:2,title:"E major and A major",summary:"One finger turns minor into major.",why:"These two chords and their minor cousins make up a huge share of popular music. You will also hear the difference between major and minor for the first time on your own guitar.",blocks:[{kind:"chords",ids:["E-maj","E-m","A-maj","A-m"],caption:"Strum E then Em, A then Am. One note changes, and the mood changes completely."},{kind:"text",text:`**E major** is Em with finger 1 added on the G string, fret 1. That one note, G sharp instead of G, is the major third. It makes the chord sound bright instead of dark.

**A major** puts three fingers side by side on fret 2 of the D, G and B strings. They will not all fit straight; angle them slightly so each one sits just behind the fret. If the high e keeps getting muted, try fingers 2 1 3 instead of 1 2 3.`},{kind:"progression",instrument:"guitar",chords:["E-maj","A-maj"],beats:4,bpm:60,pattern:"1"},{kind:"theory",id:"t-chords"}],mistakes:["On A major, the high e string touched by finger 3.","On E major, finger 1 too far from the fret, so the G string buzzes."],words:"e major a major minor difference"},{id:"g2-d",instrument:It,stage:2,title:"D major",summary:"A small triangle on the top four strings.",why:"D completes the set of five chords in this stage, and with A and E it gives you your first full progression.",blocks:[{kind:"chords",ids:["D-maj"]},{kind:"steps",items:["Finger 1 on the G string, fret 2.","Finger 3 on the B string, fret 3.","Finger 2 on the high e, fret 2.","Strum from the D string down. The A and low E stay silent."]},{kind:"progression",instrument:"guitar",chords:["D-maj","A-maj","E-maj","A-maj"],beats:4,bpm:60,pattern:"1",caption:"D, A, E, A: three chords that belong to the key of A."}],mistakes:["Strumming all six strings. Aim the strum at the four strings that belong.","Finger 3 lying flat and muting the high e."],words:"d major chord"},{id:"g2-changes",instrument:It,stage:2,title:"The one minute change drill",summary:"The fastest way to make chord changes automatic.",why:"Every guitarist goes through the stage of knowing the chords but not being able to switch fast enough. This drill is the most efficient cure there is.",blocks:[{kind:"steps",items:["Pick a pair of chords, for example A and D.","Start a one minute timer. Change back and forth, strumming once on each chord, as many times as you can.","Count only clean changes, where the chord rings properly.","Write down the number. Tomorrow, try to beat it."]},{kind:"text",text:`Pairs to drill: Em and Am, A and D, E and A, D and E, Am and E, D and Em. Thirty clean changes a minute between every pair is the ready check for this stage.

**Find the pivots.** Look for a finger that stays in the same place in both chords, or slides along the same string. From A to D, finger 1 stays near fret 2 of the G string. Keep it in contact while the others move. From Em to E, fingers 2 and 3 do not move at all.`},{kind:"progression",instrument:"guitar",chords:["A-maj","D-maj"],beats:2,bpm:60,pattern:"1",caption:"A changing to D every two beats. Start slow and only speed up when every change is clean."}],method:["Look at the next chord in your mind before you move. The fingers follow what you see.","Move all fingers together, as a shape, close to the strings.","Never practise a change you cannot yet make cleanly at speed. Slow it down until it is clean."],ready:["30 clean changes in a minute between any pair of Em, Am, E, A and D."],words:"chord changes switching one minute changes pivot finger"},{id:"g2-mute",instrument:It,stage:2,title:"Muting strings you are not playing",summary:"Keeping wrong strings quiet with both hands.",why:"A chord with one wrong string ringing sounds like a wrong chord. Good players are as careful about what does not sound as what does.",kind:"technique",blocks:[{kind:"text",text:`There are three ways to keep a string quiet:

**Aim the strum.** For D, start the strum on the D string. This is the main method for beginners.

**Touch it with a fretting finger.** For A minor, the tip of finger 3 can just touch the low E so even if you hit it, it makes no sound. For C, finger 3 often touches the low E in the same way.

**Release the pressure.** Lifting a fretting finger slightly, without leaving the string, stops a note instantly. This is how you will stop chords at the end of a phrase.`},{kind:"chords",ids:["A-m","D-maj","C-maj"],caption:"Each of these has a string that must stay silent."}],mistakes:["Muting a string that should ring by touching it accidentally. Check by picking each string after placing the chord."],words:"muting mute dampen unwanted strings"},{id:"g2-buzz",instrument:It,stage:2,title:"Fixing buzzing notes",summary:"A checklist for when a chord does not ring.",why:"Every beginner chord buzzes at first. Knowing exactly why lets you fix it in seconds instead of getting frustrated.",kind:"technique",blocks:[{kind:"steps",items:["Pick each string one at a time to find which one is wrong.","If it buzzes: the finger on that string is too far from the fret, or not pressing quite hard enough.","If it is dead or muffled: a neighbouring finger is touching it. Arch that finger more, and play on the very tip.","If an open string is dead: something is leaning on it, often the underside of finger 1 or the fleshy base of a finger.","Still buzzing with everything right? Check the tuning, then check the string is not worn out."]},{kind:"tip",title:"Fingernails",text:"Keep the fingernails of the fretting hand short. Long nails stop the fingertip landing straight down and are the hidden cause of many muted strings."}],words:"buzz buzzing dead strings muffled clean chords"},{id:"g3-g",instrument:It,stage:3,title:"G major",summary:"The widest of the open chords.",why:"G is one of the most used chords there is, and it opens up the keys of G and D.",blocks:[{kind:"chords",ids:["G-maj"]},{kind:"steps",items:["Finger 2 on the low E, fret 3.","Finger 1 on the A string, fret 2.","Finger 3 on the high e, fret 3.","Strum all six strings."]},{kind:"text",text:"The hand has to stretch across the whole neck. Let the wrist drop a little lower than for D. There is also a fuller version with fingers 3 and 4 on the B and high e strings at fret 3, shown on the G chord page; it makes the change to C and Cadd9 much easier later, so it is worth learning both."},{kind:"progression",instrument:"guitar",chords:["G-maj","D-maj"],beats:4,bpm:60,pattern:"1"}],mistakes:["Finger 1 touching the D string.","The low E struck weakly because finger 2 is not pressing at the tip."],words:"g major chord"},{id:"g3-c",instrument:It,stage:3,title:"C major",summary:"The stretch from finger 1 to finger 3.",why:"C is the chord most beginners find hardest in the first month. It is also the home chord of the key of C, so it is everywhere.",blocks:[{kind:"chords",ids:["C-maj"]},{kind:"steps",items:["Finger 3 on the A string, fret 3. This is the root, C.","Finger 2 on the D string, fret 2.","Finger 1 on the B string, fret 1.","Strum from the A string. The open G and high e must ring between your fingers."]},{kind:"progression",instrument:"guitar",chords:["C-maj","G-maj"],beats:4,bpm:60,pattern:"1"}],method:["Place finger 3 first: it is the anchor. Then 2, then 1. Once that is easy, practise placing all three at once."],mistakes:["Finger 1 lying flat and muting the open high e.","The open G muted by the underside of finger 2."],words:"c major chord"},{id:"g3-dm",instrument:It,stage:3,title:"D minor",summary:"The saddest of the open chords.",why:"With Dm you have all eight open chords of this path, and enough to play in the keys of C, G, D, A and E.",blocks:[{kind:"chords",ids:["D-m","D-maj"],caption:"D minor and D major side by side. Only the high e string changes, from fret 2 to fret 1."},{kind:"progression",instrument:"guitar",chords:["A-m","D-m","E-maj","A-m"],beats:4,bpm:60,pattern:"1",caption:"Am, Dm, E, Am: the minor key sound."}],mistakes:["Finger 1 not reaching fully onto the high e, so it buzzes."],words:"d minor dm chord"},{id:"g3-counting",instrument:It,stage:3,title:"Counting out loud",summary:"Beats, bars, and the ands in between.",why:"Rhythm is what makes chords into music. Counting out loud is the single habit that most separates players with good time from players without it.",blocks:[{kind:"text",text:`Most music moves in groups of four beats, called **bars**. Count them: **1 2 3 4, 1 2 3 4**. Beat 1 is the strongest.

Halfway between each beat is an **and**. Counting eighth notes sounds like **1 and 2 and 3 and 4 and**. Downstrokes fall on the numbers, upstrokes on the ands.

Count out loud, really out loud, not in your head, while you play. It will feel silly for a week. Then you will notice your playing is steadier than ever.`},{kind:"metronome",bpm:70,sig:"4/4",sub:2},{kind:"theory",id:"t-rhythm"}],method:["Clap and count with the metronome first. Then strum Em in quarter notes while counting. Then eighth notes, down on the numbers and up on the ands."],words:"counting rhythm beats bars eighth notes quarter notes"},{id:"g3-downup",instrument:It,stage:3,title:"Down up strumming",summary:"The hand keeps moving like a pendulum.",why:"Every strumming pattern, however complicated, sits on top of this one motion.",kind:"technique",blocks:[{kind:"text",text:`Move the strumming hand down and up continuously, in time: down on every number, up on every and. It never stops, even when you do not hit the strings.

To leave out a strum, simply miss the strings on that stroke, passing just above them, and keep the hand moving. This is the secret of every pattern: **the hand keeps time, the strings are hit or missed**.

Upstrokes usually catch only the top three or four strings. That is right; they are meant to be lighter.`},{kind:"progression",instrument:"guitar",chords:["G-maj","C-maj"],beats:4,bpm:70,pattern:"4",caption:"All eighths: down up down up. Count 1 and 2 and."}],mistakes:["Stopping the hand on a missed stroke, which breaks the rhythm.","Upstrokes as heavy as downstrokes."],words:"strumming down up upstroke downstroke pendulum"},{id:"g3-patterns",instrument:It,stage:3,title:"Your first strumming patterns",summary:"Patterns 1 to 4, from four downstrokes to all eighths.",why:"With four patterns and eight chords you can already play along with a large share of popular songs.",blocks:[{kind:"text",text:`Each pattern is eight slots, one per eighth note. D is a downstroke, U an upstroke, a dash is a missed stroke where the hand still moves.

**Pattern 1:** D - D - D - D -
**Pattern 2:** D - D U D - D U, counted 1, 2 and, 3, 4 and
**Pattern 3:** D - D U - U D U, the folk pattern
**Pattern 4:** D U D U D U D U

Pick a pattern below, press Play and strum along. Try each pattern on every chord pair you know.`},{kind:"progression",instrument:"guitar",chords:["G-maj","C-maj","D-maj","E-m"],beats:4,bpm:70,pattern:"2",caption:"G C D Em with pattern 2. This is the ready check for the stage: two minutes without stopping."}],method:["Play the pattern on one chord until you do not have to think about it.","Then add a change. If the change breaks the pattern, keep the hand moving and land the new chord late. Never stop the hand.","Only raise the tempo once a full two minutes goes by without a stop."],ready:["G C D Em round and round for two minutes at 70 bpm with pattern 2, without stopping."],words:"strumming patterns rhythm folk pattern"},{id:"g3-waltz",instrument:It,stage:3,title:"Three beats: 3/4 time",summary:"The waltz feel.",why:"Not all music counts in four. Three beats to a bar gives a lilting, swaying feel used in waltzes, folk ballads and many hymns.",blocks:[{kind:"text",text:"Count **1 2 3, 1 2 3**, with beat 1 strongest. The time signature 3/4 means three quarter note beats per bar. The basic pattern is a strong downstroke on 1, then lighter strums on 2 and 3, or down, down up, down up."},{kind:"progression",instrument:"guitar",chords:["G-maj","D-maj","E-m","C-maj"],beats:3,bpm:90,pattern:"waltz"}],words:"waltz three four 3/4 time signature"},{id:"g3-alt",instrument:It,stage:3,title:"Alternate picking",summary:"Down up on single notes.",why:"Picking every note with a downstroke limits your speed to half of what it could be. Alternate picking is the standard way to play single note lines.",kind:"technique",blocks:[{kind:"exercise",id:"g-alt-one"},{kind:"text",text:"The rule is simple: strictly alternate, down up down up, whatever the notes do. Downstrokes land on the beat, upstrokes between beats. Later you will learn economy picking, which bends this rule on purpose, but first it must be automatic."}],mistakes:["Two downstrokes in a row by habit.","A big upstroke swinging far from the string."],words:"alternate picking down up single notes"},{id:"g3-progressions",instrument:It,stage:3,title:"Your first progressions",summary:"I IV V in G and D, and the four chord loop.",why:"A progression is a sequence of chords that repeats. A handful of them underpin an enormous number of songs, so learning them is learning music, not just exercises.",blocks:[{kind:"text",text:`Chords in a key are numbered with Roman numerals. In the key of G, G is I, C is IV and D is V. In D, D is I, G is IV and A is V. The same pattern of numbers sounds the same in any key, which is why musicians talk in numbers.

The **I IV V** progression is the backbone of folk, blues, country and rock. The **I V vi IV** loop is the sound of countless pop songs. Play along with each.`},{kind:"progression",instrument:"guitar",chords:["G-maj","C-maj","D-maj","G-maj"],beats:4,bpm:72,pattern:"2",caption:"I IV V I in G."},{kind:"progression",instrument:"guitar",chords:["D-maj","G-maj","A-maj","D-maj"],beats:4,bpm:72,pattern:"2",caption:"I IV V I in D."},{kind:"progression",instrument:"guitar",chords:["G-maj","D-maj","E-m","C-maj"],beats:4,bpm:72,pattern:"3",caption:"I V vi IV in G, with the folk pattern."},{kind:"theory",id:"t-roman"}],ready:["You can play all three progressions from memory, with any of patterns 1 to 4."],words:"progression i iv v one four five pop progression four chords"}],ye="piano",O3=[60,62,64,65,67].map((l,r)=>({m:l,role:"right",label:String(r+1)})),B3=[48,50,52,53,55].map((l,r)=>({m:l,role:"left",label:String(5-r)})),_3=[{id:"p1-layout",instrument:ye,stage:1,title:"The keyboard: twos and threes",summary:"The pattern of black keys is your map.",why:"A piano has 88 keys but only twelve different notes, repeated. Once you see the pattern, the whole keyboard becomes familiar.",blocks:[{kind:"text",text:`Look at the black keys. They come in groups: **two, then three, then two, then three**, all the way along. That pattern is how pianists find their way without counting.

The white keys are named with the first seven letters, **A B C D E F G**, then the names start again. The black keys take their names from the white keys next to them, which you will learn in stage 2 of theory.`},{kind:"keyboard",from:48,to:76,marks:[49,51,61,63,73,75].map(l=>({m:l,role:"tone",label:"2"})).concat([54,56,58,66,68,70].map(l=>({m:l,role:"root",label:"3"}))),caption:"Groups of two and three black keys. Tap any key to hear it."}],ready:["You can find a group of two and a group of three black keys anywhere, with your eyes closed, by touch."],words:"keyboard layout black keys white keys groups"},{id:"p1-find-c",instrument:ye,stage:1,title:"Finding C, and the octaves",summary:"C sits just left of every group of two black keys.",why:"C is the reference point for everything. Middle C is where the two hands meet and where reading music begins.",blocks:[{kind:"text",text:`Find a group of **two black keys**. The white key just to the left of it is **C**. Every C on the piano is in the same place relative to its two black keys.

From one C to the next is an **octave**: eight white keys counting both Cs, twelve keys counting the black ones. The Cs sound like the same note, higher or lower, which is why they share a name.

**Middle C** is the C nearest the middle of the piano, usually right in front of the maker's name. It is called C4 in this app, and it is where your two thumbs meet in C position.`},{kind:"keyboard",from:36,to:84,marks:[36,48,60,72,84].map(l=>({m:l,role:l===60?"root":"tone",label:l===60?"Mid":"C"})),names:!1,caption:"Every C, with middle C in the accent colour."},{kind:"drill",id:"keys-white"}],ready:["You can play every C on the keyboard from lowest to highest without hesitating."],words:"find c middle c octave octaves"},{id:"p1-posture",instrument:ye,stage:1,title:"Bench height and posture",summary:"Sitting so the arms can do their work.",why:"Tension in the shoulders and wrists is the main cause of uneven playing and of pain later. Good setup costs nothing and lasts forever.",blocks:[{kind:"steps",items:["Sit in the middle of the bench, facing middle C, on the front half of the seat.","Adjust the height so your forearms are level with the keys, or just slightly above. Elbows should be at about the height of the white keys.","Sit far enough back that your elbows are a little in front of your body, not tucked in against your ribs.","Feet flat on the floor, the right one slightly forward, ready for the pedal later.","Shoulders relaxed and down. Check them every few minutes; they creep up when you concentrate."]},{kind:"tip",title:"On a digital keyboard",text:"If your keyboard is on a table, the bench height rule still applies. A folding chair plus a cushion often works better than a dining chair."}],mistakes:["Sitting too close, so the elbows are jammed back.","Wrists dropping below the keys.","Leaning in to read the music, which pulls the shoulders forward."],words:"posture bench height sitting wrists relaxed shoulders"},{id:"p1-hand",instrument:ye,stage:1,title:"Hand shape and finger numbers",summary:"Fingers 1 to 5, thumb to little finger, on both hands.",why:"Every piece of piano music and every scale in this app uses finger numbers. Learning them now makes everything else readable.",blocks:[{kind:"text",text:`Fingers are numbered from the thumb outwards, the same on both hands: **1 thumb, 2 index, 3 middle, 4 ring, 5 little**. Hold your hands up, palms facing each other, and wiggle each number as you say it.

For the hand shape, let your arms hang loose at your sides. Notice the natural curve of the fingers. Lift the hands onto the keys without changing that curve. Play on the fingertips, with the thumb resting on its side, and keep the wrist level and soft.`},{kind:"keyboard",from:45,to:72,marks:[...B3,...O3],caption:"C position. Right hand thumb on middle C, left hand little finger on the C below. Blue is the right hand, amber the left."}],mistakes:["Flat fingers playing on the pads.","The thumb sticking out stiffly or hanging off the keyboard.","The little finger collapsing at the top joint."],words:"finger numbers hand shape curved fingers relaxed wrist"},{id:"p1-five",instrument:ye,stage:1,title:"The C five finger position",summary:"One finger per key, each hand alone.",why:"This is the first real playing, and it trains the most important thing of all: every finger producing an even, controlled note.",blocks:[{kind:"exercise",id:"p-five-r"},{kind:"exercise",id:"p-five-l"}],method:["Start slowly, with a metronome. Listen for evenness: every note the same loudness, every note exactly with the click.","Fingers 4 and 5 are naturally weaker. Do not push them harder; play the others a little lighter until they match.","Five minutes a day, each hand. Once both are even at 60, raise the tempo with the ladder."],ready:["C D E F G up and down evenly at 60 bpm with each hand."],words:"five finger position c position exercise"},{id:"p2-treble",instrument:ye,stage:2,title:"The treble clef",summary:"The five lines for the right hand, and three landmark notes.",why:"Reading lets you learn any music written down, and the treble clef is where melodies live.",blocks:[{kind:"text",text:`Music is written on five lines, the **staff**. Notes sit on the lines or in the spaces between them. Higher on the staff is higher in pitch.

The curly sign at the start is the **treble clef**, also called the G clef: its inner curl wraps around the second line from the bottom, which is the G above middle C.

Learn three **landmarks** rather than memorising every note: **middle C** on its own short line below the staff, **G** on the second line, and the **C** in the third space. Read every other note as a step up or down from the nearest landmark.`},{kind:"staff",clef:"treble",music:"C4w D4w E4w F4w | G4w A4w B4w C5w | D5w E5w F5w G5w",caption:"From middle C up to the top line. Press Show names to check yourself.",play:!0},{kind:"staff",clef:"treble",music:"C4h G4h | C5h G4h | C4w",caption:"The three landmarks: middle C, G and the C in the third space."},{kind:"drill",id:"treble"}],ready:["20 notes named in 60 seconds on the treble clef."],theory:["t-notes"],words:"treble clef g clef reading notes staff landmarks"},{id:"p2-bass",instrument:ye,stage:2,title:"The bass clef",summary:"The lines for the left hand, and its landmarks.",why:"The left hand reads from the bass clef. Learning it now, before habits form, saves years of reading the left hand slowly.",blocks:[{kind:"text",text:`The **bass clef**, or F clef, has two dots either side of the fourth line from the bottom. That line is the **F below middle C**.

Landmarks here: **middle C** on its own line just above the staff, **F** on the fourth line between the dots, and the **C** in the second space, an octave below middle C.

A warning: the bass clef is not the treble clef moved down. The same position on the lines is a different note. Learn it as its own language.`},{kind:"staff",clef:"bass",music:"C3w D3w E3w F3w | G3w A3w B3w C4w",caption:"From the C in the second space up to middle C.",play:!0},{kind:"staff",clef:"bass",music:"C4h F3h | C3h F3h | C4w",caption:"The landmarks: middle C, F and low C."},{kind:"drill",id:"bass"}],ready:["20 notes named in 60 seconds on the bass clef."],words:"bass clef f clef reading left hand"},{id:"p2-grand",instrument:ye,stage:2,title:"The grand staff",summary:"Both clefs joined, with middle C in between.",why:"Piano music is written on the grand staff, one staff for each hand. Seeing how the two connect makes reading two hands possible.",blocks:[{kind:"text",text:`The treble and bass staves are joined by a line on the left to make the **grand staff**. Middle C sits exactly between them: one ledger line below the treble staff, or one ledger line above the bass staff. It is the same key, written in either place.

Usually the right hand reads the top staff and the left hand the bottom one.`},{kind:"staff",clef:"grand",music:"C4w | G4w | E4w | C4w // C3w | G2w | C3w | C3w",caption:"Both hands in C position, written on the grand staff.",play:!0}],words:"grand staff both hands middle c ledger line"},{id:"p2-values",instrument:ye,stage:2,title:"Note values: whole, half and quarter",summary:"How long each note lasts.",why:"The position of a note tells you which key to play. Its shape tells you when and for how long. Both matter equally.",blocks:[{kind:"text",text:`**Whole note**: an open oval with no stem. Hold it for **4 beats**.
**Half note**: open with a stem. **2 beats**.
**Quarter note**: filled in with a stem. **1 beat**.
**Dotted half note**: a dot adds half again, so **3 beats**.

Count steadily and hold each note for its full value. Releasing a half note early is the most common rhythm mistake of all.`},{kind:"staff",clef:"treble",time:"4/4",music:"C4w | E4h E4h | G4q G4q G4q G4q | C5h. G4q",caption:"Whole, halves, quarters, then a dotted half and a quarter. Press Play to hear it with a count in.",play:!0}],method:["Clap each line while counting 1 2 3 4 out loud before you play it. Hold your hands together for long notes."],words:"note values whole half quarter dotted rhythm duration"},{id:"p2-rests",instrument:ye,stage:2,title:"Rests",summary:"Silence has a length too.",why:"A rest is not a pause to think. It is a precise silence, counted exactly like a note.",blocks:[{kind:"text",text:"Every note value has a matching **rest**. The **whole rest** hangs below the fourth line, the **half rest** sits on the middle line, and the **quarter rest** is a squiggle. Lift your hand off for exactly the length shown, and keep counting."},{kind:"staff",clef:"treble",time:"4/4",music:"C4q rq E4q rq | G4h rh | rw | C5h G4h",caption:"Notes and rests together. Count every beat, including the silent ones.",play:!0}],words:"rests whole rest half rest quarter rest silence"},{id:"p2-time",instrument:ye,stage:2,title:"Bars and time signatures",summary:"4/4 and 3/4, and how to count a bar.",why:"Bars group the beats so your eye can read music in chunks, and the time signature tells you how big each chunk is.",blocks:[{kind:"text",text:`Vertical **bar lines** divide music into **bars**. The **time signature** at the start has two numbers. The top one tells you how many beats are in each bar. The bottom one tells you what kind of note gets one beat; 4 means a quarter note.

**4/4**: four quarter beats per bar, the most common time. **3/4**: three quarter beats per bar, the waltz.

The first beat of every bar is a little stronger than the rest. Feel it as you count.`},{kind:"staff",clef:"treble",time:"3/4",music:"C4h E4q | G4h. | F4q E4q D4q | C4h.",caption:"An original tune in 3/4.",play:!0},{kind:"metronome",bpm:80,sig:"3/4"}],words:"time signature bar measure 4/4 3/4 bar lines"},{id:"p2-sight",instrument:ye,stage:2,title:"Sight reading, level 1",summary:"Short five finger tunes, one hand at a time.",why:"Sight reading is a skill of its own, built by reading a little new music every day. Starting gently now pays off enormously.",blocks:[{kind:"text",text:"Before playing each line: find the first note, check which finger plays it, and look at the time signature. Then count one bar out loud and play without stopping, even if you make a mistake. **Keeping going matters more than every note being right.**"},{kind:"staff",clef:"treble",time:"4/4",music:"C4q D4q E4q C4q | E4q F4q G4h | G4q F4q E4q D4q | C4w",caption:"Right hand, C position, thumb on C."},{kind:"staff",clef:"treble",time:"4/4",music:"E4h D4h | C4q D4q E4q F4q | G4q E4q D4q E4q | C4w",caption:"Right hand again."},{kind:"staff",clef:"bass",time:"4/4",music:"C3q D3q E3q F3q | G3h E3h | F3q E3q D3q E3q | C3w",caption:"Left hand, little finger on C."},{kind:"staff",clef:"bass",time:"3/4",music:"G3h. | E3q F3q G3q | F3q E3q D3q | C3h.",caption:"Left hand in 3/4."}],method:["Never practise a sight reading piece more than twice. Once it is familiar, it is no longer sight reading.","Look one note ahead of the one you are playing.","Read by direction and distance: up a step, down a skip, same note. Do not name every note in your head."],words:"sight reading level 1 beginner reading practice"},{id:"p3-triads",instrument:ye,stage:3,title:"C, F and G triads",summary:"Three note chords built on every other key.",why:"With these three chords you can accompany a great many simple songs in C major.",blocks:[{kind:"text",text:`A **triad** is three notes, each a skip apart: play one key, skip one white key, play the next, skip one, play the next. From C that gives **C E G**. From F: **F A C**. From G: **G B D**.

Play them with the right hand using fingers **1 3 5**, keeping the hand in the same shape and simply moving it.`},{kind:"keyboard",chord:"C-maj",caption:"C major: C E G, fingers 1 3 5."},{kind:"pianoChords",ids:["C-maj","F-maj","G-maj"],caption:"Tap to hear each chord. The arrow opens the chord page with every inversion."},{kind:"theory",id:"t-chords"}],mistakes:["Notes landing one after another. Drop the whole hand at once, from the wrist.","Collapsing finger 5."],words:"triads c major f major g major chords right hand"},{id:"p3-lh-root",instrument:ye,stage:3,title:"Left hand: root and fifth",summary:"The simplest, strongest bass pattern.",why:"The left hand's main job in most styles is to give the harmony a foundation. Root and fifth does that with just two fingers.",blocks:[{kind:"text",text:`The **root** is the note a chord is named after. The **fifth** is five white keys up, counting the root as one. For C, that is C and G, played by left hand fingers **5 and 1**.

Play them together as a two note chord, or one after the other: root on beat 1, fifth on beat 3.`},{kind:"keyboard",from:43,to:60,marks:[{m:48,role:"left",label:"5"},{m:55,role:"left",label:"1"}],caption:"Left hand C and G."},{kind:"progression",instrument:"piano",chords:["C-maj","F-maj","G-maj","C-maj"],pattern:"broken",bpm:70,caption:"Root, fifth, octave, fifth under each chord. Listen to the left hand."}],words:"left hand root fifth bass accompaniment"},{id:"p3-turns",instrument:ye,stage:3,title:"Both hands, step 1: taking turns",summary:"One hand plays, then the other.",why:"Before two hands can play at once, the brain has to get used to passing attention smoothly from one to the other.",blocks:[{kind:"exercise",id:"p-turns"}],method:["First play only the right hand bars, counting the left hand bars as silent bars. Then only the left hand bars.","Then put them together at a tempo slow enough that you never stop.","If you stop at the change between hands, practise just the last beat of one hand and the first beat of the other, ten times."],words:"two hands both hands taking turns alternating hands"},{id:"p3-hold",instrument:ye,stage:3,title:"Both hands, step 2: one holds, one moves",summary:"A long note in the left hand under a moving right hand.",why:"This is the first time both hands are down at once. The left hand has a simple job, so all your attention can stay on keeping it held.",blocks:[{kind:"exercise",id:"p-hold"}],method:["Practise each hand alone first, until each is easy.","Together, very slowly. Say the counts out loud. Watch the left hand key: does it stay down for all four beats?","When it is reliable, close your eyes for the last bar. Feel the held note rather than looking at it."],words:"two hands hold long notes"},{id:"p3-parallel",instrument:ye,stage:3,title:"Both hands, step 3: parallel motion",summary:"Both hands moving together, in the same direction.",why:"Parallel motion is where real coordination starts. The notes move together, but the fingers do not, and teaching the brain that is the key to everything that follows.",blocks:[{kind:"exercise",id:"p-parallel"}],method:["Hands separately first, with the same tempo, until each is even.","Together at half the tempo you can manage hands separately. Seriously, half.","Listen for the two notes landing as one sound. If you hear two clicks, slow down until they merge.","Only raise the tempo by 4 bpm after a full minute where every pair lands together."],ready:["A five finger tune with both hands moving in parallel, perfectly together."],words:"parallel motion both hands together coordination"},{id:"p3-scales",instrument:ye,stage:3,title:"Your first scales",summary:"C, G and F major, one octave, hands separately.",why:"Scales teach the fingers to cross smoothly, which is needed for any melody longer than five notes.",blocks:[{kind:"text",text:`A scale goes up one key at a time through the eight notes of a key. Five fingers cannot cover eight notes, so the hand has to **cross**. In the right hand going up, the thumb **passes under** the hand. In the left hand going up, finger 3 or 4 **crosses over** the thumb.

C and G major use the same fingering in both hands. F major is different in the right hand: the thumb passes under after finger 4, because the fourth note is B flat, a black key, and the thumb is kept on white keys.`},{kind:"exercise",id:"p-scale-c"},{kind:"keyboard",scale:{root:"G",type:"major"},caption:"G major, with its one black key, F sharp. Open the scale page for the full fingering."},{kind:"keyboard",scale:{root:"F",type:"major"},caption:"F major, with B flat."}],method:["Practise only the crossing first: in C major right hand, play E with 3 then F with 1, back and forth, until the thumb moves under without the hand jumping."],ready:["The C major scale one octave with each hand at 60 bpm with the right fingering."],words:"c major scale g major f major thumb under fingering"},{id:"p3-ivv",instrument:ye,stage:3,title:"I IV V I in C",summary:"Your first progression with both hands.",why:"This chord sequence, home, away, tension, home, is the foundation of a huge amount of music, and playing it with both hands is a real milestone.",blocks:[{kind:"exercise",id:"p-ivv"},{kind:"progression",instrument:"piano",chords:["C-maj","F-maj","G-maj","C-maj"],pattern:"pulse",bpm:72,caption:"The same progression as an accompaniment pattern. Try playing along with the right hand chords."},{kind:"theory",id:"t-roman"}],ready:["I IV V I in C with left hand roots and right hand triads, changing exactly on beat 1."],words:"i iv v i progression c major both hands chords"}],G3="theory";let L3=0;const ze=l=>({...l,instrument:G3,stage:++L3}),R3=[ze({id:"t-notes",title:"Notes and the musical alphabet",summary:"Seven letters, five in between, and the octave.",why:"Every other idea in music is built from these twelve notes. On the piano you can see them; on the guitar you have to learn where they hide. Seeing them on both at once is the quickest way in.",blocks:[{kind:"text",text:`Music uses seven letter names: **A B C D E F G**, then they repeat. The repeat is the **octave**: the next C sounds like the same note, higher.

Between most of the letters there is one more note. It is named from its neighbours: the note between C and D is **C sharp** (C♯, a little higher than C) or **D flat** (D♭, a little lower than D). Same note, two names. These pairs are called **enharmonic**.

Two pairs of letters have no note in between: **E and F**, and **B and C**. That is why the piano has no black key there.

So there are **twelve different notes** in all, and then the pattern repeats.`},{kind:"dual",notes:["C","D","E","F","G","A","B"],caption:"The seven natural notes on both instruments. On the guitar they are scattered across the strings; the dots show every place they appear in the first twelve frets."},{kind:"dual",notes:["C#","D#","F#","G#","A#"],caption:"The five notes in between: the black keys, and on the guitar the frets between the natural notes."},{kind:"tip",title:"On the guitar",text:"The 12th fret is the octave of the open string, which is why it has the double dot. Everything from fret 12 up repeats frets 0 to 11."}],words:"notes musical alphabet sharps flats enharmonic octave twelve notes"}),ze({id:"t-semitones",title:"Semitones and tones",summary:"The two smallest steps, and how they look on each instrument.",why:"Scales, chords and intervals are all measured in these two steps. They are the ruler of music.",blocks:[{kind:"text",text:`A **semitone**, or half step, is the smallest step: from one key to the very next key on the piano, black or white, or from one fret to the next on the guitar.

A **tone**, or whole step, is two semitones: skip one key, or move two frets.

On the guitar this could not be simpler: **one fret is one semitone**, always. On the piano you count every key, black ones included. E to F and B to C are semitones even though both are white keys.`},{kind:"dual",interval:{from:"C",semis:1},caption:"A semitone: C to C♯. Next key, next fret."},{kind:"dual",interval:{from:"C",semis:2},caption:"A tone: C to D. Two keys, two frets."},{kind:"dual",interval:{from:"E",semis:1},caption:"E to F is also a semitone, with no black key between."}],words:"semitone tone half step whole step"}),ze({id:"t-intervals",title:"Intervals",summary:"The distance between two notes, and what each one sounds like.",why:"Intervals are what melodies and chords are made of. Knowing them by name, by shape and by sound is the foundation of playing by ear.",blocks:[{kind:"text",text:`An **interval** is the distance between two notes, counted in letter names and measured in semitones. C to E covers three letters (C D E), so it is a **third**, and it is four semitones, which makes it a **major third**. C to E♭ is also a third, but three semitones: a **minor third**.

The main intervals, in semitones: minor second 1, major second 2, minor third 3, major third 4, perfect fourth 5, tritone 6, perfect fifth 7, minor sixth 8, major sixth 9, minor seventh 10, major seventh 11, octave 12.`},{kind:"dual",interval:{from:"C",semis:4},caption:"Major third. Bright: the bottom two notes of a major chord."},{kind:"dual",interval:{from:"C",semis:3},caption:"Minor third. Darker: the bottom two notes of a minor chord."},{kind:"dual",interval:{from:"C",semis:7},caption:"Perfect fifth. Open and strong: the power chord."},{kind:"dual",interval:{from:"C",semis:5},caption:"Perfect fourth. The distance between most guitar strings."},{kind:"dual",interval:{from:"C",semis:12},caption:"Octave. The same note, higher."},{kind:"tip",title:"Shapes stay the same",text:"On the guitar an interval has the same shape wherever you play it, as long as you do not cross the G to B string pair, which is tuned a semitone closer than the others. On the piano the shape changes with the black keys, but the count in semitones never does."}],words:"intervals thirds fifths fourths octave major minor perfect tritone distance"}),ze({id:"t-scales",title:"How a major scale is built",summary:"Tone tone semitone, tone tone tone semitone.",why:"Once you know the pattern, you can build any major scale yourself from any note, on either instrument.",blocks:[{kind:"text",text:`A major scale is seven notes, one for each letter, following this pattern of steps:

**tone, tone, semitone, tone, tone, tone, semitone**

Start on C and follow it: C, D, E, F, G, A, B, C. All white keys. Start on G and the pattern forces one black key, F♯, to keep the seventh step a tone and the last step a semitone. That is why the key of G has one sharp.

The notes of a scale are numbered 1 to 7 and called **degrees**. Degree 1 is the **root** or tonic, home.`},{kind:"dual",scale:{root:"C",type:"major"},caption:"C major: no sharps or flats."},{kind:"dual",scale:{root:"G",type:"major"},caption:"G major: one sharp, F♯."},{kind:"dual",scale:{root:"F",type:"major"},caption:"F major: one flat, B♭."}],words:"major scale pattern whole whole half degrees tonic build scale"}),ze({id:"t-minor",title:"Minor scales",summary:"Natural, harmonic and melodic, and how they differ.",why:"Minor keys carry most of music's sadness, tension and drama. The three versions exist for practical reasons, and knowing why makes them easy to remember.",blocks:[{kind:"text",text:`The **natural minor** scale lowers the 3rd, 6th and 7th degrees of the major scale. A natural minor is A B C D E F G: all white keys, the same notes as C major started from A. A minor is the **relative minor** of C major.

The **harmonic minor** raises the 7th again, giving a G♯ in A minor. That creates a strong pull back to the root and the major V chord that minor keys need. The gap between F and G♯ gives it an exotic sound.

The **melodic minor** raises both the 6th and 7th, to smooth that gap for melodies. In classical music it does this going up and returns to the natural minor coming down.`},{kind:"dual",scale:{root:"A",type:"minor"},caption:"A natural minor."},{kind:"dual",scale:{root:"A",type:"harmonic"},caption:"A harmonic minor, with G♯."},{kind:"dual",scale:{root:"A",type:"melodic"},caption:"A melodic minor, with F♯ and G♯."}],words:"minor scales natural harmonic melodic relative minor"}),ze({id:"t-keys",title:"Key signatures",summary:"The sharps or flats written once at the start of every line.",why:"Reading music in any key except C depends on this, and so does knowing which chords belong together.",blocks:[{kind:"text",text:`Rather than writing a sharp before every F in G major, music writes it once at the start of each line. That is the **key signature**. It means: every F is F♯ unless told otherwise.

Sharps are always added in the same order: **F C G D A E B**. Flats in the reverse order: **B E A D G C F**.

Two quick tricks. With sharps, the key is a semitone above the last sharp: last sharp C♯, key of D. With flats, the key is the second to last flat: flats B♭ E♭ A♭, key of E♭. (One flat on its own is F major.)`},{kind:"staff",clef:"treble",key:"D",music:"D4q E4q F#4q G4q | A4q B4q C#5q D5q",caption:"D major. The two sharps in the key signature apply to every F and C.",play:!0},{kind:"staff",clef:"treble",key:"Eb",music:"Eb4q F4q G4q Ab4q | Bb4q C5q D5q Eb5q",caption:"E♭ major, three flats.",play:!0},{kind:"theory",id:"t-circle"}],words:"key signature sharps flats order of sharps order of flats"}),ze({id:"t-circle",title:"The circle of fifths",summary:"All twelve keys in order, and how they are related.",why:"It is a map of every key, showing at a glance how many sharps or flats each has and which keys are close neighbours.",blocks:[{kind:"text",text:`Start at C, with no sharps or flats. Go up a fifth to G: one sharp. Up another fifth to D: two sharps. Each step clockwise adds one sharp. Going anticlockwise, down a fifth each time, adds one flat: F has one, B♭ two, and so on. At the bottom the two sides meet, where F♯ and G♭ are the same key.

Neighbours on the circle share all but one note, which is why music moves easily between them. The three chords next to each other at any point are the I, IV and V of the middle key: around C you find F and G.`},{kind:"circle"}],words:"circle of fifths keys sharps flats related keys"}),ze({id:"t-chords",title:"Building chords",summary:"Stacking thirds: major, minor, diminished and augmented.",why:"Every chord on both instruments is built the same way. Understand it once and chord names stop being a list to memorise.",blocks:[{kind:"text",text:`A **triad** is three notes stacked in thirds: the **root**, the **third** and the **fifth**. The kind of third decides the character:

**Major**: major third then minor third, 1 3 5. Bright.
**Minor**: minor third then major third, 1 ♭3 5. Dark.
**Diminished**: two minor thirds, 1 ♭3 ♭5. Tense.
**Augmented**: two major thirds, 1 3 ♯5. Unsettled.

On the piano you can see the stack. On the guitar the same notes are spread across the strings and often doubled, but they are the same three notes.`},{kind:"dual",chord:{root:"C",type:"maj"},caption:"C major: C E G."},{kind:"dual",chord:{root:"C",type:"m"},caption:"C minor: C E♭ G. Only the third moves."},{kind:"dual",chord:{root:"C",type:"dim"},caption:"C diminished: C E♭ G♭."},{kind:"dual",chord:{root:"C",type:"aug"},caption:"C augmented: C E G♯."},{kind:"dual",chord:{root:"C",type:"sus4"},caption:"C suspended fourth: the third replaced by the fourth."}],words:"chord construction triads major minor diminished augmented stacking thirds root third fifth"}),ze({id:"t-sevenths",title:"Seventh chords and beyond",summary:"Adding a fourth note, and then ninths, elevenths and thirteenths.",why:"Sevenths give harmony its colour: the blues, jazz, soul and most modern pop rely on them.",blocks:[{kind:"text",text:`Stack one more third on a triad and you get a **seventh chord**. The four common ones:

**Major seventh** (Cmaj7): major triad plus a major seventh. Soft and dreamy.
**Dominant seventh** (C7): major triad plus a minor seventh. Bluesy, wants to move.
**Minor seventh** (Cm7): minor triad plus a minor seventh. Smooth.
**Half diminished** (Cm7♭5): diminished triad plus a minor seventh.

Keep stacking and you reach the **9th**, **11th** and **13th**: the 2nd, 4th and 6th an octave higher. Pianists rarely play every note; the 5th, and often the root, are left out.`},{kind:"dual",chord:{root:"C",type:"maj7"},caption:"Cmaj7: C E G B."},{kind:"dual",chord:{root:"C",type:"7"},caption:"C7: C E G B♭."},{kind:"dual",chord:{root:"C",type:"m7"},caption:"Cm7: C E♭ G B♭."},{kind:"dual",chord:{root:"C",type:"9"},caption:"C9: C7 with D on top."}],words:"seventh chords maj7 dominant 7 m7 half diminished ninth extended chords"}),ze({id:"t-symbols",title:"Reading chord symbols",summary:"What C, Cm, C7, Cmaj7, Csus4 and C/E mean.",why:"Chord symbols are how both guitarists and pianists read harmony in almost every kind of popular music.",blocks:[{kind:"text",text:`A chord symbol starts with the **root**. What follows describes the rest:

**C** major. **Cm** or **Cmin** minor. **C7** dominant seventh. **Cmaj7** or **CΔ** major seventh. **Cm7** minor seventh. **Cdim** or **C°** diminished. **Caug** or **C+** augmented. **Csus4** fourth instead of third. **Cadd9** major plus a ninth, no seventh. **C6** major plus a sixth.

A slash means a different bass note: **C/E** is a C chord with E as the lowest note. Pianists play E in the left hand; guitarists find a C shape with E on the bottom string.`},{kind:"pianoChords",ids:["C-maj","C-m","C-7","C-maj7","C-m7","C-dim","C-aug","C-sus4","C-add9","C-6"],caption:"Every symbol above, on C. Tap to hear the difference."},{kind:"drill",id:"symbols"}],words:"chord symbols reading chord charts slash chords lead sheet"}),ze({id:"t-roman",title:"Roman numerals and the chords in a key",summary:"Seven chords per key, numbered so they work in every key.",why:"Roman numerals let you understand a progression once and play it in any key. They are how musicians actually think about harmony.",blocks:[{kind:"text",text:`Build a triad on each note of a major scale, using only notes from that scale, and you get seven chords with a fixed pattern of types:

**I** major, **ii** minor, **iii** minor, **IV** major, **V** major, **vi** minor, **vii°** diminished.

Upper case numerals are major chords, lower case are minor. In C that is C, Dm, Em, F, G, Am, B°. In G it is G, Am, Bm, C, D, Em, F♯°. Same pattern, different letters.

**I** is home. **V** is the strongest pull back home. **IV** moves away gently. **vi** is the relative minor, home with a sadder colour.`},{kind:"diatonic",key:"C"},{kind:"progression",instrument:"piano",chords:["C-maj","A-m","F-maj","G-maj"],pattern:"pulse",bpm:76,caption:"I vi IV V in C on piano."},{kind:"progression",instrument:"guitar",chords:["G-maj","E-m","C-maj","D-maj"],pattern:"3",bpm:76,caption:"The same I vi IV V, in G on guitar. Different letters, same sound."}],words:"roman numerals diatonic chords chords in a key harmony function i iv v"}),ze({id:"t-cadences",title:"Cadences",summary:"How phrases end: finished, unfinished, or surprised.",why:"Cadences are the punctuation of music. Hearing them tells you where a phrase is going and makes you a better accompanist and improviser.",blocks:[{kind:"text",text:`**Perfect cadence**, V to I: the full stop. Strong and final.
**Plagal cadence**, IV to I: a softer ending, sometimes called the amen cadence.
**Imperfect cadence**, anything to V: a comma. The phrase pauses, waiting for an answer.
**Interrupted cadence**, V to vi: the music sets up home, then lands somewhere unexpected.`},{kind:"progression",instrument:"piano",chords:["F-maj","G-maj","C-maj","C-maj"],pattern:"block",bpm:80,caption:"Perfect cadence: IV V I in C."},{kind:"progression",instrument:"piano",chords:["C-maj","F-maj","C-maj","C-maj"],pattern:"block",bpm:80,caption:"Plagal: I IV I."},{kind:"progression",instrument:"guitar",chords:["G-maj","C-maj","G-maj","D-maj"],pattern:"2",bpm:80,caption:"Imperfect: ending on D, the V of G."},{kind:"progression",instrument:"guitar",chords:["C-maj","G-maj","A-m","A-m"],pattern:"2",bpm:80,caption:"Interrupted: G sets up C, but the music goes to Am."}],words:"cadence perfect plagal imperfect interrupted deceptive ending"}),ze({id:"t-rhythm",title:"Rhythm and meter",summary:"Beats, note lengths, simple and compound time, syncopation.",why:"Rhythm is what makes the right notes sound like music. It is also the part beginners neglect most.",blocks:[{kind:"text",text:`The **beat** is the steady pulse you tap your foot to. **Meter** groups beats into bars: in 4/4, four beats; in 3/4, three.

Note lengths divide the beat: a quarter note is one beat, an eighth note half a beat, a sixteenth a quarter of a beat. **Triplets** squeeze three notes into the space of two.

**Simple time** divides each beat in two (2/4, 3/4, 4/4). **Compound time** divides each beat in three: 6/8 is two beats per bar, each split into three eighths, giving a rolling, lilting feel.

**Syncopation** puts emphasis where you do not expect it, usually on the and between beats. It is the life of funk, reggae, rock and pop.`},{kind:"staff",clef:"treble",time:"4/4",music:"C5q C5q C5e C5e C5q | C5e C5e C5e C5e C5h | C5s C5s C5s C5s C5q C5h",caption:"Quarters, eighths and sixteenths on one note. Press Play and count along.",play:!0},{kind:"staff",clef:"treble",time:"4/4",music:"C5e C5q C5e rq C5q | C5e C5q C5e C5h",caption:"Syncopation: notes on the and of a beat, held across the next beat.",play:!0},{kind:"metronome",bpm:72,sig:"6/8"}],words:"rhythm meter beat time signature simple compound syncopation triplets"}),ze({id:"t-transpose",title:"Transposition and the capo",summary:"Playing the same music in a different key.",why:"Songs often need moving to suit a voice or another instrument. Guitarists also transpose to use easier chord shapes.",blocks:[{kind:"text",text:`To **transpose**, move every note and chord by the same interval. The easiest way is through Roman numerals: work out the numbers in the old key, then read the same numbers in the new key. G C D in G is I IV V; in A it becomes A D E.

A **capo** clamps across the guitar's neck and raises every string. With a capo at fret 2, the G shape sounds as A, the C shape as D, the D shape as E. So you can play in A using G shapes. A simple rule: the capo raises the sound by one semitone per fret.

On the piano there is no capo. Transposing means truly playing in the new key, which is one of the best reasons to learn all your scales.`},{kind:"progression",instrument:"guitar",chords:["G-maj","C-maj","D-maj","G-maj"],pattern:"2",bpm:80,caption:"I IV V in G."},{kind:"progression",instrument:"guitar",chords:["A-maj","D-maj","E-maj","A-maj"],pattern:"2",bpm:80,caption:"The same, transposed up a tone to A. With a capo at fret 2 you could play it with the G shapes."},{kind:"diatonic",key:"G"}],words:"transposition transpose capo change key"}),ze({id:"t-modes",title:"The modes",summary:"Seven scales from the same notes, each with its own mood.",why:"Modes explain the sound of much rock, jazz, folk and film music, and give improvisers seven colours from one set of notes.",blocks:[{kind:"text",text:`Play the white keys from C to C and you get C major, also called **Ionian**. Play the same white keys from D to D and you get **Dorian**: a minor sound with a bright raised sixth. From E: **Phrygian**, dark and Spanish. From F: **Lydian**, dreamy with its raised fourth. From G: **Mixolydian**, major with a bluesy flat seventh. From A: **Aeolian**, the natural minor. From B: **Locrian**, unstable.

The modes are usually compared from the same root, to hear the difference. Below are a few on D.`},{kind:"dual",scale:{root:"D",type:"dorian"},caption:"D Dorian: minor with a major sixth, B."},{kind:"dual",scale:{root:"D",type:"mixolydian"},caption:"D Mixolydian: major with a flat seventh, C."},{kind:"dual",scale:{root:"D",type:"lydian"},caption:"D Lydian: major with a sharp fourth, G♯."},{kind:"dual",scale:{root:"D",type:"phrygian"},caption:"D Phrygian: minor with a flat second, E♭."}],words:"modes dorian phrygian lydian mixolydian aeolian locrian ionian"}),ze({id:"t-form",title:"Song form",summary:"Verse, chorus, bridge, and the twelve bar blues.",why:"Knowing the shape of a piece lets you learn it in big chunks, keep your place, and write your own.",blocks:[{kind:"text",text:`Most songs are built from a few repeating sections, labelled with letters:

**Verse**: the story, with new words each time over the same music.
**Chorus**: the part everyone remembers, returning with the same words.
**Bridge**: a contrasting section, often once, near the end.
**Intro** and **outro**: the way in and the way out.

Common forms are verse chorus verse chorus bridge chorus, and **AABA**, where the bridge is the B.

The **twelve bar blues** is a form in itself: four bars of I, two of IV, two of I, then V, IV, I and V. It repeats round and round.`},{kind:"progression",instrument:"guitar",chords:["A-7","A-7","A-7","A-7","D-7","D-7","A-7","A-7","E-7","D-7","A-7","E-7"],beats:4,pattern:"1",bpm:100,caption:"A twelve bar blues in A. Count the bars as it plays."}],words:"song form structure verse chorus bridge aaba twelve bar blues"})],_i="guitar",Cn="piano",q3=[{id:"g4-why",instrument:_i,stage:4,title:"Why the two hands fall out of step",summary:"What synchronisation is, and how to hear when it is missing.",why:"On the guitar, one hand chooses the note and the other makes it sound. If they arrive even a few milliseconds apart, the note is weak, clicky or buzzy, however good each hand is on its own.",blocks:[{kind:"text",text:`Play a note on fret 5 of the G string. Now try two deliberately wrong versions.

**Pick first, finger late.** You hear a short buzz or a clipped, thin note, then the real note. The pick struck an unfretted or half fretted string.

**Finger first, pick late.** Less obvious: the note is fine but late, and if you are playing fast the finger may already be leaving, so the note is cut short and dull.

In good playing the fingertip arrives a fraction before the pick, so the string is fully pressed at the instant it is struck. At slow speeds that happens naturally. As speed rises, each hand starts to keep its own time, and the gap appears. Everything in this stage is about closing that gap and keeping it closed as you get faster.`},{kind:"fretboard",from:3,to:9,marks:[{s:3,f:5,finger:1,role:"root"},{s:3,f:7,finger:3}],caption:"Tap these two notes slowly and listen to the attack of each one."}],method:["Record yourself on your phone playing any exercise at your top speed, then at half speed. Listen back. Clean notes at half speed and smeared ones at top speed is the sign of synchronisation, not of slow fingers.","Use your ears as the judge, not your eyes. Synchronisation problems are almost invisible but easy to hear."],words:"synchronisation synchronization hands together sync timing coordination"},{id:"g4-land",instrument:_i,stage:4,title:"Picking exactly when the finger lands",summary:"The core exercise for locking the hands together.",why:"Most early sloppiness is not slow fingers. It is the two hands arriving at slightly different times. This lesson trains the exact moment they meet.",blocks:[{kind:"steps",items:["On the G string, put finger 1 on fret 1 and pick once. Then finger 2 on fret 2 and pick. Listen to the start of each note.","Now slow motion: move finger 2 towards the string, and start the pick moving at the same time, so they arrive together. Repeat ten times.","Play the pairs exercise below at a tempo where every note is clean, with alternate picking.","Only then move to the full chromatic walk in eighth notes."]},{kind:"exercise",id:"g-sync-pairs"},{kind:"exercise",id:"g-chromatic8"}],method:["The ladder: start at a tempo where every note is clean. Play for one minute.","If every note was clean, add 4 bpm. If one was not, stay. If several were not, drop 8.","Stop for the day after three missed steps in a row. Practising mistakes trains them in.","Record the tempo you reach each day with the buttons under the exercise. The graph on the Progress page shows you getting faster."],mistakes:["Lifting fingers too high between notes, so they take longer to land.","Picking from the elbow, which makes the pick late and heavy.","Squeezing the neck. Tension slows both hands and pulls them apart."],ready:["Chromatic 1 2 3 4 in eighth notes, clean for one minute at 80 bpm."],exercises:["g-sync-pairs","g-chromatic8"],words:"picking finger lands sync chromatic alternate picking eighth notes"},{id:"g4-ladder",instrument:_i,stage:4,title:"Building speed with a metronome",summary:"The ladder method, and why slow practice makes you fast.",why:"Speed is not built by trying to play fast. It is built by playing correctly at a tempo just above your comfort, over and over, and letting the nervous system automate it.",blocks:[{kind:"text",text:`The rule everyone eventually learns the hard way: **you get good at exactly what you practise**. If you practise a passage at a speed where one note in five is wrong, you are practising mistakes, and the mistakes become automatic.

The ladder keeps you at the edge of your ability without falling off it. Every exercise in this app has the ladder built in: after each minute, press one of the three buttons and the tempo moves for you.`},{kind:"steps",items:["Find your clean tempo: the fastest speed where a full minute goes by with no mistakes. Write it down.","Each session, start 8 bpm below that tempo to warm up.","Climb in steps of 4 bpm, one clean minute at each step.","When you miss a step, stay there. Miss it three times and stop for today. You will often find tomorrow's start is higher than today's end.","Once a week, try a burst far above your clean tempo for a few seconds. It shows your hands what is coming, without training mistakes."]},{kind:"metronome",bpm:60,sig:"4/4",sub:2},{kind:"exercise",id:"g-sync-burst"}],method:["Slow is not the opposite of fast. Clean slow playing is how fast playing is made."],words:"ladder speed tempo metronome practice method get faster"},{id:"g4-fast",instrument:_i,stage:4,title:"Staying synchronised at higher tempos",summary:"Small motions, relaxed hands, and thinking in groups.",why:"Above about 100 bpm in sixteenths, technique that worked slowly starts to fail. These are the adjustments that let the hands stay locked together as you speed up.",blocks:[{kind:"text",text:`**Make every motion small.** The fretting fingers should hover a few millimetres above the strings. The pick should travel only just past the string. Distance is time.

**Stay relaxed.** Check your shoulders, your jaw and your thumb every few minutes. Tension is the most common reason the hands drift apart at speed.

**Think in groups, not notes.** At high speed you cannot think about each note. Think of four notes as one gesture, aimed at the first note of each group, which lands on the beat.

**Accent the first note of each group.** It gives both hands a shared target every beat.`},{kind:"exercise",id:"g-sync-3nps"},{kind:"exercise",id:"g-string-cross"}],method:["Practise in three tempos each day: slow and perfect, your clean tempo, and short bursts above it.","Accent the first note of every group of four. When that is easy, move the accent to the second note. It forces both hands to stay aware of every note."],mistakes:["Playing fast for longer than a minute when tension creeps in. Stop, shake out, start again."],words:"speed fast playing relaxed minimal motion groups accents three notes per string"},{id:"g4-palm",instrument:_i,stage:4,kind:"technique",title:"Palm muting",summary:"The chunky, controlled sound of rock rhythm guitar.",why:"Palm muting gives rhythm parts punch and lets you control exactly how long each note rings.",blocks:[{kind:"text",text:`Rest the fleshy outside edge of your picking hand lightly on the strings, right where they come off the bridge saddle. Pick through the strings as normal.

Move the hand a few millimetres towards the neck and the notes go dead and thuddy. Move it back over the bridge and they ring. The sweet spot is in between: you still hear the pitch, but short and chunky.`},{kind:"exercise",id:"g-palm-mute"}],mistakes:["Pressing down hard, which pulls the strings sharp.","The hand drifting forward as you play, so the notes gradually die."],ready:["Palm muted notes that sound chunky, not dead and not ringing."],words:"palm muting palm mute chug rock rhythm"},{id:"g4-power",instrument:_i,stage:4,title:"Power chords",summary:"Root and fifth, movable anywhere on the E and A strings.",why:"Two fingers, one shape, every key. Power chords are the foundation of rock and punk and the easiest way to start playing up the neck.",blocks:[{kind:"text",text:`A power chord is just the **root and the fifth**, sometimes with the root doubled on top. With the root on the low E string at any fret, finger 1 plays the root and finger 3 plays two frets higher on the A string. The same shape works with the root on the A string.

To know which power chord you are playing, you need the note names on the E and A strings. That is stage 5, but you can start with these: on the low E, fret 3 is G, fret 5 is A, fret 7 is B, fret 8 is C. On the A string, fret 3 is C, fret 5 is D, fret 7 is E.`},{kind:"chords",ids:["G-5","A-5","C-5","D-5"]},{kind:"exercise",id:"g-power-move"}],ready:["Power chords with roots on the E and A strings, moved anywhere in time."],words:"power chords fifth chords rock 5 chords"},{id:"p4-contrary",instrument:Cn,stage:4,title:"Contrary motion",summary:"Hands moving apart and back together, with matching fingers.",why:"In contrary motion both hands use the same finger at the same moment, which makes it the friendliest way to practise scales with two hands.",blocks:[{kind:"exercise",id:"p-contrary"},{kind:"text",text:"Compare this with parallel motion in stage 3. There, the hands moved the same way but the fingers did not match. Here, the hands move opposite ways but the fingers do match. Your brain finds the second much easier, and that teaches you something important: **coordination is about fingers and patterns, not just notes**."}],method:["Hands separately, once each, to remind the fingers of the pattern.","Together at a tempo where you can say the finger numbers out loud as you play.","Watch the thumbs pass under at the same moment, on F in the right hand and G in the left."],ready:["C major hands together in contrary motion, one octave, at 72 bpm."],words:"contrary motion scales both hands"},{id:"p4-alberti",instrument:Cn,stage:4,title:"Broken chords and the Alberti bass",summary:"Turning a held chord into a moving pattern.",why:"Most accompaniments are chords broken into patterns. The Alberti bass, low high middle high, is the classic one, and it trains a relaxed, rotating wrist.",blocks:[{kind:"text",text:`Take a C chord in the left hand: C G E, fingers 5 1 3. Play them one at a time in the order **low, high, middle, high**: C G E G. That is the Alberti bass, named after an Italian composer who loved it.

The secret is a gentle **rotation** of the forearm, like turning a door handle, rather than lifting each finger separately.`},{kind:"exercise",id:"p-alberti"},{kind:"progression",instrument:"piano",chords:["C-maj","G-maj","A-m","F-maj"],pattern:"alberti",bpm:70,caption:"The same idea under a four chord progression."}],ready:["An Alberti bass in the left hand under a simple right hand melody."],words:"alberti bass broken chords accompaniment rotation"},{id:"p4-eighths",instrument:Cn,stage:4,title:"Eighth notes and dotted rhythms",summary:"Splitting the beat in two, and the long short dotted feel.",why:"Almost all real music uses eighth notes. Dotted rhythms give it lilt and energy.",blocks:[{kind:"text",text:`An **eighth note** has a flag, or is joined to its neighbour by a beam. Two eighths fill one beat: count **1 and 2 and**.

A **dotted quarter** lasts one and a half beats, so it is almost always followed by an eighth to complete the beat: long, short. Count 1 and 2 and, holding through the 1 and 2, playing again on the and.`},{kind:"staff",clef:"treble",time:"4/4",music:"C4e D4e E4e F4e G4q G4q | A4e A4e G4e F4e E4h | C4q. D4e E4q. F4e | G4q. F4e E4h",caption:"Eighths, then dotted quarters with eighths. Count it before playing.",play:!0},{kind:"exercise",id:"p-dotted"}],words:"eighth notes quavers dotted rhythm dotted quarter"},{id:"p4-ledger",instrument:Cn,stage:4,title:"Ledger lines and key signatures",summary:"Reading above and below the staff, and in G and F.",why:"Music soon leaves the five lines and the key of C. These two skills take your reading into real pieces.",blocks:[{kind:"text",text:`**Ledger lines** are short lines that extend the staff upwards or downwards. Count them in steps from the nearest landmark: the first ledger line above the treble staff is A, below it is middle C.

A **key signature** of one sharp, on the F line, means every F is F sharp: the key of G major. One flat, on the B line, means every B is B flat: F major.`},{kind:"staff",clef:"treble",music:"A3w B3w C4w | A5w B5w C6w",caption:"Ledger lines below and above the treble staff."},{kind:"staff",clef:"treble",key:"G",time:"4/4",music:"G4q A4q B4q C5q | D5q E5q F#5q G5q | G5q D5q B4q G4q | D4w",caption:"G major. The sharp is in the key signature, so every F is F sharp.",play:!0},{kind:"staff",clef:"bass",key:"F",time:"4/4",music:"F2q G2q A2q Bb2q | C3q D3q E3q F3q | C3h A2h | F2w",caption:"F major in the bass clef.",play:!0},{kind:"drill",id:"treble-ledger"},{kind:"theory",id:"t-keys"}],words:"ledger lines key signature g major f major reading"},{id:"p4-touch",instrument:Cn,stage:4,kind:"technique",title:"Legato and staccato",summary:"Smooth and connected, or short and detached.",why:"Touch is what turns notes into expression. These are the two basic touches every other one is built from.",blocks:[{kind:"text",text:`**Legato**, marked with a curved slur over the notes, means connected. Each key goes down exactly as the previous one comes up, so there is no gap and no overlap. Think of walking: one foot does not leave the ground until the other has landed.
