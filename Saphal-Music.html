**Staccato**, marked with a dot above or below the note, means short and detached. Release the key immediately, bouncing lightly from the wrist. A staccato note does not have to be loud; it just has to be short.`},{kind:"staff",clef:"treble",time:"4/4",music:"C4q D4q E4q F4q | G4q' G4q' G4q' rq | E4q' E4q' E4q' rq | C4w",caption:"Legato in bar 1, then staccato, marked with dots.",play:!0},{kind:"exercise",id:"p-legato-staccato"}],ready:["Legato in one passage and staccato in the next without thinking about it."],words:"legato staccato touch articulation slur detached"},{id:"p4-dynamics",instrument:Cn,stage:4,title:"Dynamics and articulation marks",summary:"p, mf, f, accents and tenuto.",why:"Music without dynamics is like speaking without expression. These marks tell you how to shape each phrase.",blocks:[{kind:"text",text:`Dynamics use Italian words, written in short form under the staff:

**pp** pianissimo, very soft. **p** piano, soft. **mp** mezzo piano, moderately soft. **mf** mezzo forte, moderately loud. **f** forte, loud. **ff** fortissimo, very loud.

A **crescendo** gets gradually louder, a **diminuendo** gradually softer.

Articulation marks change how one note is played: an **accent** (>) means lean on it; a **tenuto** line means hold it for its full value with a little weight; a **fermata** means pause and hold.`},{kind:"staff",clef:"treble",time:"4/4",music:"!p C4q E4q G4q E4q | !mf C4q E4q G4q E4q | !f C5q> G4q E4q C4q_ | C4w~",caption:"Soft, medium, loud, then an accent, a tenuto and a fermata."}],words:"dynamics piano forte mezzo crescendo accent tenuto fermata articulation"},{id:"p7-method",instrument:Cn,stage:7,title:"How hand independence is built",summary:"The practice method behind every exercise in this stage.",why:"Getting the hands independent is the hardest thing about the piano. It is not a talent; it is built in a specific way, and doing it in that way saves months of frustration.",blocks:[{kind:"text",text:"The brain naturally wants both hands to do the same thing. Independence means teaching it that two different patterns can run at once. It happens in four stages, and skipping any of them is why so many people stall."},{kind:"steps",items:["**Each hand alone until it is automatic.** Not just correct: automatic, so you can play it while talking. If one hand still needs your attention, there is none left over for the other.","**Learn the combined pattern as one thing.** Tap the rhythm of both hands on your lap or a table, slowly. Say it out loud. You are learning a single new pattern, not two old ones at once.","**Put it together very slowly, in tiny pieces.** One beat. Then the next beat. Then join them. Then two beats. A few seconds of music, perfect, many times.","**Speed up only when it is effortless.** Use the ladder. Each time you go faster, the combined pattern must still feel like one thing."]},{kind:"tip",title:"The weaker hand leads",text:"When it falls apart, the trouble is almost always the hand that has the simpler part, because you stopped paying attention to it. Practise the combination with your attention deliberately on that hand."},{kind:"tip",title:"Sleep on it",text:"Independence improves between sessions, not during them. Ten focused minutes every day beats an hour on Sunday by a long way."}],words:"hand independence practice method two hands coordination how to practise"},{id:"p7-rhythms",instrument:Cn,stage:7,title:"Different rhythms in each hand",summary:"Quarters against eighths, then swapped.",why:"The simplest real independence: both hands keep the same beat but divide it differently.",blocks:[{kind:"exercise",id:"p-two-against-one"}],method:["Tap it first: right hand taps twice for every left hand tap. Then reverse.","Play each bar alone with both hands until it is easy. Then join them, practising the moment where the roles swap.","Count the eighth notes out loud the whole time: 1 and 2 and."],ready:["Quarters in one hand against eighths in the other, then swapped, without stopping."],words:"different rhythms each hand quarters eighths independence"},{id:"p7-touch",instrument:Cn,stage:7,title:"Different touches in each hand",summary:"Legato in one hand, staccato in the other.",why:"Much of the piano repertoire asks for a singing line over a light, detached accompaniment. It feels impossible at first, then suddenly clicks.",blocks:[{kind:"exercise",id:"p-legato-staccato"}],method:["Each hand alone, exaggerating its touch: the legato smoother than you think necessary, the staccato shorter.","Together very slowly. If the right hand starts copying the bounce, stop and play only the first beat of each bar until the hands separate."],words:"legato staccato different touch each hand"},{id:"p7-balance",instrument:Cn,stage:7,title:"A loud melody over a soft accompaniment",summary:"Volume control in each hand, separately.",why:"This is what makes a pianist sound like a pianist: the tune sings out while everything else sits underneath.",blocks:[{kind:"exercise",id:"p-balance"}],method:["Play the accompaniment alone at the very softest even level you can. Remember that feeling.","Play the melody alone with full, warm tone, using arm weight.","Together, think only about the melody, and let the left hand stay at its remembered level."],ready:["A loud melody over a soft accompaniment."],words:"balance melody accompaniment voicing dynamics each hand"},{id:"p7-3v2",instrument:Cn,stage:7,title:"Three against two",summary:"Real polyrhythm: two different pulses at the same time.",why:"Three against two appears constantly in classical and romantic music, and it is the gateway to all polyrhythm. Learned correctly, it takes days, not years.",blocks:[{kind:"text",text:`Three even notes in one hand, two even notes in the other, in the same span of time. The hands only meet on the first note.
