recognition"}),Dn({id:"e-intervals2",title:"Intervals, part two: down, together, and the confusing pairs",summary:"Descending and harmonic intervals, and how to tell similar ones apart.",why:"Real music goes down as often as up, and many intervals are heard together in chords. Some pairs are easy to confuse until you know exactly what to listen for.",blocks:[{kind:"text",text:"**Descending intervals** feel different from the same interval going up. Learn them separately, with their own memory tunes."},{kind:"listen",cols:1,items:[re("Minor second down",Ie(1,"down"),"Memory: Für Elise, the first two notes."),re("Major second down",Ie(2,"down"),"Memory: Mary Had a Little Lamb, Three Blind Mice."),re("Minor third down",Ie(3,"down"),"Memory: This Old Man, a playground call."),re("Major third down",Ie(4,"down"),"Memory: Swing Low, Sweet Chariot. Beethoven's Fifth Symphony."),re("Perfect fourth down",Ie(5,"down"),"Memory: the opening of Mozart's Eine kleine Nachtmusik."),re("Perfect fifth down",Ie(7,"down"),"Memory: the bass falling from 5 to 1 at the end of a piece.")]},{kind:"text",text:`**Harmonic intervals**, both notes at once, are heard as a single colour. Listen for smoothness. Octaves, fifths and fourths blend almost into one note. Thirds and sixths are sweet. Seconds, sevenths and the tritone clash.

A useful trick: hum the bottom note, then the top note. That turns a harmonic interval back into a melodic one you already know.`},{kind:"listen",items:[re("Octave together",Ie(12,"together")),re("Fifth together",Ie(7,"together")),re("Major third together",Ie(4,"together")),re("Major sixth together",Ie(9,"together")),re("Major second together",Ie(2,"together")),re("Tritone together",Ie(6,"together"))]},{kind:"text",text:`**The confusing pairs**, and the one thing to listen for in each:

**Minor third or major third?** Sad or bright. Imagine a third note above, a fifth from the bottom: minor or major chord?
**Fourth or fifth?** The fourth sounds unfinished, as if it wants to go on. The fifth sounds complete, hollow, like a power chord. Here Comes the Bride against Twinkle Twinkle.
**Minor sixth or major sixth?** The minor sixth is dramatic and dark, the major sixth warm and wide.
**Minor seventh or major seventh?** The minor seventh is bluesy and relaxed; the major seventh is sharp, almost an octave but painfully not.
**Tritone or fifth?** The fifth is stable. The tritone is the most unstable sound there is.`},{kind:"listen",items:[re("Minor third",Ie(3)),re("Major third",Ie(4)),re("Fourth",Ie(5)),re("Fifth",Ie(7)),re("Minor sixth",Ie(8)),re("Major sixth",Ie(9)),re("Minor seventh",Ie(10)),re("Major seventh",Ie(11))],caption:"Play each pair one after the other, several times, until the difference is obvious."},{kind:"tip",title:"Inversions",text:"A fourth upside down is a fifth; a third upside down is a sixth; a second upside down is a seventh. If C up to F is a fourth, F up to C is a fifth. Once you know one of a pair well, you can work out the other."},{kind:"earDrill",mode:"intervals",text:"intervals at level 4"}],words:"descending intervals harmonic intervals confusing intervals fourth fifth inversion"}),Dn({id:"e-chords",title:"Chord quality: major, minor and beyond",summary:"What each kind of chord sounds like, and the trick of listening for the third.",why:"Knowing a chord's quality is half of knowing the chord. Combined with hearing its root, it lets you work out the chords of songs by ear.",blocks:[{kind:"text",text:`**The four triads.**
**Major**: bright, settled, happy or proud.
**Minor**: darker, sad, serious or tender.
**Diminished**: squeezed and tense, like suspense music.
**Augmented**: stretched and dreamy, as if nothing can settle.

The difference between major and minor is one note, the third. Learn to listen to the middle of the chord, not just its overall mood.`},{kind:"listen",items:[re("Major",{t:"chord",type:"maj"}),re("Minor",{t:"chord",type:"m"}),re("Diminished",{t:"chord",type:"dim"}),re("Augmented",{t:"chord",type:"aug"}),re("Major, broken",{t:"chord",type:"maj",arp:!0}),re("Minor, broken",{t:"chord",type:"m",arp:!0}),re("Diminished, broken",{t:"chord",type:"dim",arp:!0}),re("Augmented, broken",{t:"chord",type:"aug",arp:!0})],caption:"Played together, then broken up one note at a time. Breaking a chord up makes the third much easier to hear."},{kind:"steps",items:["**Sing the chord.** Hum the bottom note, then the middle, then the top, like the broken versions above.","**Judge the third.** From the bottom note to the middle: is it a major third or a minor third?","**Judge the fifth.** From the bottom to the top: a normal fifth, or squeezed (diminished) or stretched (augmented)?"]},{kind:"text",text:"**Suspended chords** have no third at all, so they are neither happy nor sad. **Sus2** is open and airy; **sus4** is tense and wants to fall to major."},{kind:"listen",items:[re("Sus2",{t:"chord",type:"sus2"}),re("Sus4",{t:"chord",type:"sus4"}),re("Major",{t:"chord",type:"maj"})]},{kind:"text",text:`**Seventh chords** add a fourth note.
**Major seventh**: soft, dreamy, a little wistful.
**Dominant seventh**: bluesy and restless, it wants to move.
**Minor seventh**: mellow and smooth.
**Half diminished**: dark and searching.
**Diminished seventh**: maximum suspense.

The trick: first decide if the bottom three notes are major or minor, then listen to the top note. A major seventh is right next to the octave and rubs gently. A minor seventh is a step lower and sounds bluesy.`},{kind:"listen",items:[re("Major seventh",{t:"chord",type:"maj7"}),re("Dominant seventh",{t:"chord",type:"7"}),re("Minor seventh",{t:"chord",type:"m7"}),re("Half diminished",{t:"chord",type:"m7b5"}),re("Diminished seventh",{t:"chord",type:"dim7"})]},{kind:"earDrill",mode:"chords",text:"chord quality"}],words:"chord quality major minor diminished augmented seventh chords by ear"}),Dn({id:"e-scales",title:"Recognising scales by ear",summary:"Major, minor, pentatonic, blues and the modes, and the step by step method.",why:"Knowing which scale a melody or solo uses tells you the mood the music is going for, and which notes you can use to play along or improvise.",blocks:[{kind:"text",text:`Every scale here is played over a low drone of its home note, so you always hear each note against home. That is the secret of recognising scales: never listen to the notes on their own, always against the root.

**The method, one question at a time.**`},{kind:"steps",items:["**Is the third major or minor?** This splits every scale into two families. Bright: major, Lydian, Mixolydian, major pentatonic. Dark: minor, Dorian, Phrygian, harmonic and melodic minor, Locrian, minor pentatonic, blues.","**How many notes?** Five notes with big gaps is a pentatonic. Six with one gritty extra note is the blues scale. Seven is a major or minor scale or a mode.","**Listen to the top: the 7th.** Does the note before home pull strongly up to it (a major 7th, as in major, Lydian, harmonic and melodic minor)? Or does it sit a whole step below, relaxed (Mixolydian, natural minor, Dorian, Phrygian)?","**Listen for the one special note.** Each mode has a single note that gives it away. In Dorian the 6th is bright. In Phrygian the 2nd is a dark half step. In Lydian the 4th is raised. In Mixolydian the 7th is lowered."]},{kind:"listen",items:[re("Major",{t:"scale",type:"major"},"bright, half steps at 3 to 4 and 7 to 8"),re("Natural minor",{t:"scale",type:"minor"},"sad from the third note"),re("Harmonic minor",{t:"scale",type:"harmonic"},"a big gap, then a sharp pull home"),re("Melodic minor",{t:"scale",type:"melodic"},"minor below, major above"),re("Major pentatonic",{t:"scale",type:"majpent"},"five notes, no half steps, happy"),re("Minor pentatonic",{t:"scale",type:"minpent"},"five notes, bluesy minor"),re("Blues",{t:"scale",type:"blues"},"the gritty extra note between 4 and 5")]},{kind:"text",text:"**The modes** are seven scales made from the same notes, each starting on a different note. Compare them from the same home note and their special notes stand out."},{kind:"listen",items:[re("Ionian (major)",{t:"scale",type:"major"},"the reference"),re("Dorian",{t:"scale",type:"dorian"},"minor with a bright 6th: soulful"),re("Phrygian",{t:"scale",type:"phrygian"},"dark half step at the start: Spanish"),re("Lydian",{t:"scale",type:"lydian"},"raised 4th: floating, film music"),re("Mixolydian",{t:"scale",type:"mixolydian"},"low 7th: rock and blues"),re("Aeolian (natural minor)",{t:"scale",type:"minor"},"plain minor"),re("Locrian",{t:"scale",type:"locrian"},"the darkest, unstable")]},{kind:"tip",title:"Hear them in music",text:"Play a drone of the home note on your instrument, or hold it on the piano, and improvise slowly with one mode for a few minutes. Then switch to another mode over the same drone. Ten minutes of this teaches the colours better than any amount of reading."},{kind:"earDrill",mode:"scales",text:"name the scale"},{kind:"theory",id:"t-modes"}],words:"recognise scales by ear modes by ear dorian mixolydian phrygian lydian pentatonic blues scale"}),Dn({id:"e-progressions",title:"Hearing chord progressions",summary:"Follow the bass, feel home and away, and recognise the common progressions.",why:"Most songs use one of a handful of progressions. Recognising them by ear means you can play along with a song after hearing it once.",blocks:[{kind:"text",text:`**Follow the bass.** The lowest note usually plays the root of each chord. Hum along with the bass line, not the melody. Then work out each bass note as a scale degree: 1, 4, 5, 6 and so on. The chord on each degree is usually the one from the key: 1 major, 2 minor, 3 minor, 4 major, 5 major, 6 minor.

**Feel the function.** Each chord feels like home (I, vi), away (IV, ii) or tension (V). The V chord is the one that makes you lean forward waiting for home.`},{kind:"listen",items:[re("I IV V I",{t:"prog",roman:["I","IV","V","I"],key:"C"},"home, away, tension, home"),re("I V vi IV",{t:"prog",roman:["I","V","vi","IV"],key:"C"},"the pop progression"),re("I vi IV V",{t:"prog",roman:["I","vi","IV","V"],key:"C"},"the 1950s ballad"),re("vi IV I V",{t:"prog",roman:["vi","IV","I","V"],key:"C"},"same chords, starts minor"),re("I ♭VII IV I",{t:"prog",roman:["I","bVII","IV","I"],key:"C"},"the rock anthem"),re("ii V I",{t:"prog",roman:["ii7","V7","Imaj7","Imaj7"],key:"C"},"jazz"),re("i ♭VII ♭VI V",{t:"prog",roman:["i","bVII","bVI","V"],key:"A",minor:!0},"the Spanish descent"),re("Twelve bar blues",{t:"prog",roman:["I7","I7","I7","I7","IV7","IV7","I7","I7","V7","IV7","I7","V7"],key:"C"},"the blues")]},{kind:"steps",items:["Listen to the whole progression twice without trying to name anything. Just feel where it rests.","Hum the bass line and count how many chords there are before it repeats.","Find the home chord: where does it feel finished?","Name each bass note as a degree, then choose major or minor for each chord.","Compare with the common progressions. Very often it is one of them."]},{kind:"earDrill",mode:"progressions",text:"chord progressions"},{kind:"theory",id:"t-progressions"}],words:"hear chord progressions by ear bass line function common progressions"}),Dn({id:"e-melody",title:"Melodies: hearing a tune and playing it back",summary:"How to work out a melody note by note.",why:"Playing back what you hear is the skill most people mean by playing by ear. It is built from everything in the earlier chapters.",blocks:[{kind:"text",text:"Working out a melody is called **dictation**. It feels hard at first because you try to catch every note at once. The trick is to listen in layers."},{kind:"steps",items:["**Sing it back first.** If you cannot sing it, you cannot play it yet. Listen again until you can hum the whole tune.","**Find the first note.** Often it is do, mi or sol of the key. Find it on the instrument by searching higher or lower.","**Trace the shape.** Does the tune go up or down? By steps (next door notes) or leaps (skips)?","**Use scale degrees.** Sing the tune with do re mi. Most simple melodies move mostly by step through the scale.","**Then rhythm.** Which notes are long and which are short? Count along with the beat.","**Play it slowly**, one phrase at a time, checking against your memory of the tune."]},{kind:"listen",items:[re("Steps only",{t:"notes",seq:[60,62,64,65,64,62,60],key:60,step:.5},"do re mi fa mi re do"),re("A leap",{t:"notes",seq:[60,64,67,64,60],key:60,step:.5},"do mi sol mi do: the home chord"),re("Below home",{t:"notes",seq:[60,59,57,59,60],key:60,step:.5},"do ti la ti do"),re("Ends with 7 to 1",{t:"notes",seq:[64,62,65,64,62,71,72],key:60,step:.5},"the leading note pulls home")]},{kind:"tip",title:"Short memory is normal",text:"If a tune slips away while you search, that is normal. Work on just the first three notes. Then the next three. Short chunks are how everyone does it, including professionals."},{kind:"earDrill",mode:"melody",text:"play it back"}],words:"melodic dictation play by ear melody figure out a tune"}),Dn({id:"e-rhythm",title:"Rhythm by ear",summary:"The pulse, subdivisions, rhythm syllables and syncopation.",why:"Rhythm is what makes music feel alive. Hearing rhythms accurately is essential for playing along with others and for reading music.",blocks:[{kind:"text",text:`**Find the pulse first.** Tap your foot to the beat before anything else. Every rhythm is measured against it.

**Hear the subdivisions.** Each beat can split in two (eighth notes), in four (sixteenths) or in three (triplets). Silently counting the subdivisions while you listen makes every rhythm measurable.

**Rhythm syllables** make rhythms easy to say and remember: **ta** for a beat, **ti ti** for two eighths, **ta a** for a half note, **tri o la** for a triplet. Say the rhythm out loud before you try to name or play it.`},{kind:"listen",items:[re("Quarters: ta ta ta ta",{t:"rhythm",pattern:"C5q C5q C5q C5q"}),re("Eighths: ti ti ti ti",{t:"rhythm",pattern:"C5e C5e C5e C5e C5e C5e C5e C5e"}),re("Mixed: ta ti ti ta ta",{t:"rhythm",pattern:"C5q C5e C5e C5q C5q"}),re("Half notes: ta a ta a",{t:"rhythm",pattern:"C5h C5h"}),re("Dotted: long short",{t:"rhythm",pattern:"C5q. C5e C5q. C5e"}),re("Triplets: tri o la",{t:"rhythm",pattern:"C5t C5t C5t C5t C5t C5t C5h"}),re("Syncopation",{t:"rhythm",pattern:"C5e C5q C5e C5q C5q"},"the note on the and is held across the beat"),re("Rests",{t:"rhythm",pattern:"C5q rq C5q rq"},"silences you still count")],caption:"Each example starts with four clicks to set the pulse."},{kind:"tip",title:"Tap, then clap",text:"Tap the beat with your foot and clap the rhythm with your hands at the same time. It feels awkward for a few days, then becomes the most useful rhythm skill you have."},{kind:"earDrill",mode:"rhythm",text:"recognise the rhythm"}],words:"rhythm by ear rhythm syllables ta ti ti subdivision syncopation triplets"}),Dn({id:"e-play-by-ear",title:"Playing songs by ear on guitar and piano",summary:"A step by step way to work out any song.",why:"This is where all the ear skills come together: hearing a song and being able to play it, without needing a chord sheet.",blocks:[{kind:"steps",items:["**Find home.** Listen to the end of the song or a chorus. Hum the note that feels most at rest. Find that note on your instrument. That is the key.","**Get the chord family.** Write out the seven chords of that key (the Theory section has them for every key). Most songs use only these, especially I, IV, V and vi.","**Follow the bass.** Hum the bass line and find each bass note. For each one, try the chord from the family built on it.","**Check major or minor.** Play the chord along with the song. If it sounds wrong, try the other quality.","**Spot the progression.** Very often it is a common one. Once you hear I V vi IV, you know the whole song.","**Then the melody,** using scale degrees and steps and leaps, as in the melody chapter."]},{kind:"text",text:`**On guitar:** use the capo to match the song's key with easy shapes. Learn the notes on the E and A strings so you can find bass notes quickly.
**On piano:** play the bass notes with the left hand first, then add right hand chords. Keep the chords close together with inversions.

**Slow it down.** Many music players can play a song slower without changing its pitch. Use that freely, especially for melodies and solos.`},{kind:"diatonic",key:"G"},{kind:"jam",instrument:"guitar",p:"pop",k:"G",text:"Practise hearing the chord changes while you play them."}],words:"play by ear figure out songs find the key work out chords by ear"}),Dn({id:"e-practice",title:"Practice plans and milestones",summary:"What to do each day, for twelve weeks, and how to know you are improving.",why:"Ear training rewards steady, short practice more than anything else. A clear plan keeps it going.",blocks:[{kind:"text",text:`**Ten minutes a day.** Two minutes singing the major scale with do re mi. Three minutes of scale degrees. Three minutes of intervals or chords, alternating days. Two minutes of play it back.

**Twenty minutes a day.** The ten minute plan, plus five minutes working out a simple tune by ear, plus five minutes of rhythm or progressions.

**Thirty minutes a day.** The twenty minute plan, plus ten minutes of playing along with songs by ear, or improvising over a drone in different modes.`},{kind:"text",text:`**A twelve week plan.**
**Weeks 1 to 2:** pitch matching, direction, major against minor chords. Degrees level 1.
**Weeks 3 to 4:** intervals level 1 and 2, degrees level 2, play it back level 1.
**Weeks 5 to 6:** chord quality level 2, scales level 1 and 2, rhythm level 1 and 2.
**Weeks 7 to 8:** intervals level 3, degrees level 3, progressions level 1 and 2.
**Weeks 9 to 10:** seventh chords, scales level 3, play it back level 3, working out simple songs.
**Weeks 11 to 12:** level 4 everywhere, the modes, and playing songs by ear.`},{kind:"text",text:`**Milestones you will notice.**
You hear major or minor in any chord without thinking.
You can sing back a short tune after hearing it twice.
You can find the key of a song by humming its home note.
You recognise the pop progression in songs on the radio.
You can play a simple tune on your instrument after a few tries.`},{kind:"text",text:`**When you get stuck.**
**I always confuse two intervals.** Practise only that pair, back and forth, for a few days. Use the compare buttons in the drill after each mistake.
**I cannot sing in tune.** Hum quietly, use the pitch matching method, and sing in the octave that suits your voice. Nearly everyone improves within a few weeks.
**My scores go down some days.** Normal. Tiredness affects hearing. Look at the trend over weeks, not days.
**It feels too easy.** Move up a level, or answer before the sound finishes.`},{kind:"earDrill",mode:"degrees",text:"start today with scale degrees"}],words:"ear training plan practice routine milestones daily ear training"})],Za=[...Yb,...Xb,...Jb,...av,...sv,...Pb,...iv,...rv],yl=new Map;function Kh(s){return yl.size!==Za.length&&(yl.clear(),Za.forEach(o=>yl.set(o.id,o))),yl.get(s)}const bl=(s,o)=>Za.filter(l=>l.instrument===s&&l.stage===o),bg=()=>Za.filter(s=>s.instrument==="theory"&&!s.section),Ph=()=>Za.filter(s=>s.section==="ear"),tn=(s,o)=>o.map(([l,c,d,u,m])=>({t:l,d:c,m:d,h:s,finger:u,v:m})),Jh=(s,o,l,c,d)=>({t:s,d:.5,s:o,f:l,finger:c,pick:d}),vl=(s,o,l=.5)=>[{t:s,d:l,s:6,f:o,finger:1,pick:"d"},{t:s,d:l,s:5,f:o+2,finger:3,pick:"d"}],lv=[{id:"g-power-move",instrument:"guitar",title:"Moving power chords",summary:"A power chord shape slid between frets 3, 5, 7 and 5 on the low strings.",focus:"Shifting a shape in time and landing it cleanly.",startBpm:60,targetBpm:110,loopBeats:8,guitar:[0,.5,1,1.5].flatMap(s=>vl(s,3)).concat([2,2.5,3,3.5].flatMap(s=>vl(s,5)),[4,4.5,5,5.5].flatMap(s=>vl(s,7)),[6,6.5,7,7.5].flatMap(s=>vl(s,5))),how:["Finger 1 on the low E, finger 3 two frets higher on the A string. Lock the shape and move it as one piece.","Release pressure as you shift, slide, then press again. Do not lift off the strings.","Mute the higher strings by letting the underside of finger 1 lie lightly across them."]},{id:"g-sync-burst",instrument:"guitar",title:"Speed bursts",summary:"Four notes in sixteenths, then a rest, on one string.",focus:"Short bursts above your comfortable speed, with rests to reset, the way fast playing is really built.",startBpm:50,targetBpm:100,loopBeats:4,guitar:[0,1,2,3].flatMap(s=>[5,7,8,7].map((o,l)=>Jh(s+l*.25,2,o,o===5?1:o===7?3:4,l%2?"u":"d")).map(o=>({...o,d:.25}))).filter(s=>s.t%2<1),how:["Play one burst of four notes, then rest for a beat. The rest is part of the exercise: check that your hand is relaxed before the next burst."
