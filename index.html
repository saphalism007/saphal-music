**Staccato**, marked with a dot above or below the note, means short and detached. Release the key immediately, bouncing lightly from the wrist. A staccato note does not have to be loud; it just has to be short.`},{kind:"staff",clef:"treble",time:"4/4",music:"C4q D4q E4q F4q | G4q' G4q' G4q' rq | E4q' E4q' E4q' rq | C4w",caption:"Legato in bar 1, then staccato, marked with dots.",play:!0},{kind:"exercise",id:"p-legato-staccato"}],ready:["Legato in one passage and staccato in the next without thinking about it."],words:"legato staccato touch articulation slur detached"},{id:"p4-dynamics",instrument:En,stage:4,title:"Dynamics and articulation marks",summary:"p, mf, f, accents and tenuto.",why:"Music without dynamics is like speaking without expression. These marks tell you how to shape each phrase.",blocks:[{kind:"text",text:`Dynamics use Italian words, written in short form under the staff:

**pp** pianissimo, very soft. **p** piano, soft. **mp** mezzo piano, moderately soft. **mf** mezzo forte, moderately loud. **f** forte, loud. **ff** fortissimo, very loud.

A **crescendo** gets gradually louder, a **diminuendo** gradually softer.

Articulation marks change how one note is played: an **accent** (>) means lean on it; a **tenuto** line means hold it for its full value with a little weight; a **fermata** means pause and hold.`},{kind:"staff",clef:"treble",time:"4/4",music:"!p C4q E4q G4q E4q | !mf C4q E4q G4q E4q | !f C5q> G4q E4q C4q_ | C4w~",caption:"Soft, medium, loud, then an accent, a tenuto and a fermata."}],words:"dynamics piano forte mezzo crescendo accent tenuto fermata articulation"},{id:"p7-method",instrument:En,stage:7,title:"How hand independence is built",summary:"The practice method behind every exercise in this stage.",why:"Getting the hands independent is the hardest thing about the piano. It is not a talent; it is built in a specific way, and doing it in that way saves months of frustration.",blocks:[{kind:"text",text:"The brain naturally wants both hands to do the same thing. Independence means teaching it that two different patterns can run at once. It happens in four stages, and skipping any of them is why so many people stall."},{kind:"steps",items:["**Each hand alone until it is automatic.** Not just correct: automatic, so you can play it while talking. If one hand still needs your attention, there is none left over for the other.","**Learn the combined pattern as one thing.** Tap the rhythm of both hands on your lap or a table, slowly. Say it out loud. You are learning a single new pattern, not two old ones at once.","**Put it together very slowly, in tiny pieces.** One beat. Then the next beat. Then join them. Then two beats. A few seconds of music, perfect, many times.","**Speed up only when it is effortless.** Use the ladder. Each time you go faster, the combined pattern must still feel like one thing."]},{kind:"tip",title:"The weaker hand leads",text:"When it falls apart, the trouble is almost always the hand that has the simpler part, because you stopped paying attention to it. Practise the combination with your attention deliberately on that hand."},{kind:"tip",title:"Sleep on it",text:"Independence improves between sessions, not during them. Ten focused minutes every day beats an hour on Sunday by a long way."}],words:"hand independence practice method two hands coordination how to practise"},{id:"p7-rhythms",instrument:En,stage:7,title:"Different rhythms in each hand",summary:"Quarters against eighths, then swapped.",why:"The simplest real independence: both hands keep the same beat but divide it differently.",blocks:[{kind:"exercise",id:"p-two-against-one"}],method:["Tap it first: right hand taps twice for every left hand tap. Then reverse.","Play each bar alone with both hands until it is easy. Then join them, practising the moment where the roles swap.","Count the eighth notes out loud the whole time: 1 and 2 and."],ready:["Quarters in one hand against eighths in the other, then swapped, without stopping."],words:"different rhythms each hand quarters eighths independence"},{id:"p7-touch",instrument:En,stage:7,title:"Different touches in each hand",summary:"Legato in one hand, staccato in the other.",why:"Much of the piano repertoire asks for a singing line over a light, detached accompaniment. It feels impossible at first, then suddenly clicks.",blocks:[{kind:"exercise",id:"p-legato-staccato"}],method:["Each hand alone, exaggerating its touch: the legato smoother than you think necessary, the staccato shorter.","Together very slowly. If the right hand starts copying the bounce, stop and play only the first beat of each bar until the hands separate."],words:"legato staccato different touch each hand"},{id:"p7-balance",instrument:En,stage:7,title:"A loud melody over a soft accompaniment",summary:"Volume control in each hand, separately.",why:"This is what makes a pianist sound like a pianist: the tune sings out while everything else sits underneath.",blocks:[{kind:"exercise",id:"p-balance"}],method:["Play the accompaniment alone at the very softest even level you can. Remember that feeling.","Play the melody alone with full, warm tone, using arm weight.","Together, think only about the melody, and let the left hand stay at its remembered level."],ready:["A loud melody over a soft accompaniment."],words:"balance melody accompaniment voicing dynamics each hand"},{id:"p7-3v2",instrument:En,stage:7,title:"Three against two",summary:"Real polyrhythm: two different pulses at the same time.",why:"Three against two appears constantly in classical and romantic music, and it is the gateway to all polyrhythm. Learned correctly, it takes days, not years.",blocks:[{kind:"text",text:`Three even notes in one hand, two even notes in the other, in the same span of time. The hands only meet on the first note.

The trick is to stop thinking of it as two rhythms. Combined, it makes one simple pattern of four sounds: **both, right, left, right**. Say it as **nice cup of tea**: nice is both hands, cup the right, of the left, tea the right.`},{kind:"polyrhythm",a:3,b:2,bpm:50},{kind:"exercise",id:"p-three-two"}],method:["Listen to the trainer above with only the three, then only the two, then both. Notice where the left hand falls between the right hand notes.","Tap it on a table, saying nice cup of tea, until it is completely even.","Play it on one note in each hand. Then on the notes of the exercise.","At speed, let it gradually turn back into two separate, even pulses."],ready:["Three against two at 60 bpm for one minute."],words:"three against two polyrhythm 3 against 2 3:2 cross rhythm"}],ke="guitar",a2=[[0,"E"],[1,"F"],[3,"G"],[5,"A"],[7,"B"],[8,"C"],[10,"D"],[12,"E"]].map(([s,r])=>({s:6,f:s,label:r,role:r==="E"?"root":"tone"})),s2=[[0,"A"],[2,"B"],[3,"C"],[5,"D"],[7,"E"],[8,"F"],[10,"G"],[12,"A"]].map(([s,r])=>({s:5,f:s,label:r,role:r==="A"?"root":"tone"})),i2=[{name:"C shape",from:0,to:4,marks:[{s:5,f:3,role:"root"},{s:4,f:2},{s:3,f:0},{s:2,f:1,role:"root"},{s:1,f:0}]},{name:"A shape",from:2,to:6,marks:[{s:5,f:3,role:"root"},{s:4,f:5},{s:3,f:5,role:"root"},{s:2,f:5},{s:1,f:3}]},{name:"G shape",from:4,to:9,marks:[{s:6,f:8,role:"root"},{s:5,f:7},{s:4,f:5},{s:3,f:5,role:"root"},{s:2,f:5},{s:1,f:8,role:"root"}]},{name:"E shape",from:7,to:11,marks:[{s:6,f:8,role:"root"},{s:5,f:10},{s:4,f:10,role:"root"},{s:3,f:9},{s:2,f:8},{s:1,f:8,role:"root"}]},{name:"D shape",from:9,to:14,marks:[{s:4,f:10,role:"root"},{s:3,f:12},{s:2,f:13,role:"root"},{s:1,f:12}]}],o2=[{id:"g5-ea",instrument:ke,stage:5,title:"Note names on the E and A strings",summary:"The two strings every barre chord and power chord is named from.",why:"Once you know these two strings, you can find any power chord or barre chord in any key, instantly.",blocks:[{kind:"text",text:`Start with the natural notes, no sharps or flats. Use the rule from theory: a tone between every pair of letters except **E to F** and **B to C**, which are a semitone, one fret.

Low E string: E 0, F 1, G 3, A 5, B 7, C 8, D 10, E 12.
A string: A 0, B 2, C 3, D 5, E 7, F 8, G 10, A 12.

Sharps and flats are the frets in between: fret 2 on the low E is F♯ or G♭.`},{kind:"fretboard",from:0,to:12,marks:[...a2,...s2],caption:"Natural notes on the low E and A strings. Tap each one and say its name."},{kind:"drill",id:"fret-ea"}],method:["One minute of the drill every day for two weeks beats an hour once. Speed comes from the daily repetition."],ready:["Any note on the E and A strings named in under three seconds."],words:"note names fretboard e string a string notes on guitar"},{id:"g5-neck",instrument:ke,stage:5,title:"The whole fretboard, and octave shapes",summary:"Every note on the neck, found with a few shapes.",why:"Knowing the neck turns the guitar from a set of shapes into an instrument you can find your way around freely.",blocks:[{kind:"text",text:`Use **octave shapes** to carry what you know across the neck. From a note on the low E string, the same note an octave higher is **two strings up and two frets up**: low E fret 3 is G, so D string fret 5 is G. From the A string it is also two strings and two frets up.

From the D or G string, because of the B string's tuning, it is **two strings up and three frets up**.

And the open strings repeat at fret 12, so everything above fret 12 is the same as below it, an octave higher.`},{kind:"fretboard",from:0,to:12,marks:[{s:6,f:3,label:"G",role:"root"},{s:4,f:5,label:"G",role:"root"},{s:2,f:8,label:"G",role:"root"},{s:5,f:10,label:"G"},{s:3,f:12,label:"G"},{s:3,f:0,label:"G"},{s:1,f:3,label:"G"}],caption:"Every G in the first twelve frets. Notice the octave shapes linking them."},{kind:"fretboard",from:0,to:12,names:!0,caption:"The full note map. Tap anywhere to hear it. Turn the phone sideways to see it lying flat."},{kind:"drill",id:"fret-all"}],words:"fretboard map note map octave shapes whole neck learn notes"},{id:"g5-pentminor",instrument:ke,stage:5,title:"The minor pentatonic scale",summary:"Shape 1, the most played scale shape in guitar music.",why:"Five notes that work over almost any rock, blues or pop backing. It is where nearly every guitarist starts playing lead.",blocks:[{kind:"text",text:`A minor pentatonic has five notes: **A C D E G**. Shape 1 sits between frets 5 and 8, with the root A under finger 1 on the low E and high e strings, and under finger 3 on the D string.

It is a box: two notes per string, easy to see, easy to remember. Move the whole box and you change key: at fret 3 it is G minor pentatonic, at fret 8 C minor pentatonic.`},{kind:"fretboard",scale:{root:"A",type:"minpent",from:5,to:8},caption:"A minor pentatonic, shape 1. The accent notes are A, the root."},{kind:"exercise",id:"g-pent1"}],ready:["Minor pentatonic shape 1 up and down at 80 bpm in eighth notes."],theory:["t-scales"],words:"minor pentatonic scale shape 1 box lead guitar"},{id:"g5-pentmajor",instrument:ke,stage:5,title:"The major pentatonic scale",summary:"The same shape, a different home note.",why:"Major pentatonic gives the happy, open sound of country, folk and much pop soloing, and you already know its shape.",blocks:[{kind:"text",text:`C major pentatonic is **C D E G A**: the same five notes as A minor pentatonic. Only the home note changes. So shape 1 of A minor pentatonic is also a C major pentatonic shape, with C as the root.

The rule: a major pentatonic shares its notes with the minor pentatonic three frets lower. For G major pentatonic, play the E minor pentatonic shape, at fret 0 or fret 12.`},{kind:"fretboard",scale:{root:"C",type:"majpent",from:5,to:8},caption:"C major pentatonic in the same box. The roots have moved."},{kind:"progression",instrument:"guitar",chords:["C-maj","A-m","F-maj","G-maj"],pattern:"2",bpm:80,caption:"A backing in C major. Play the box over it and end your phrases on C."}],words:"major pentatonic scale relative minor country"},{id:"g5-legato",instrument:ke,stage:5,kind:"technique",title:"Hammer ons and pull offs",summary:"Sounding notes with the fretting hand alone.",why:"Legato gives lead playing its flow and speed, and makes many riffs possible.",blocks:[{kind:"exercise",id:"g-legato"}],mistakes:["Hammering too softly, so the note is quieter than the picked one.","Pulling straight up off the string instead of slightly sideways, so the lower note does not ring."],ready:["Hammered and pulled notes as loud as picked notes."],words:"hammer on pull off legato technique"},{id:"g5-slides",instrument:ke,stage:5,kind:"technique",title:"Slides",summary:"Gliding between notes along a string.",why:"Slides join notes vocally and let you move between positions on the neck.",blocks:[{kind:"exercise",id:"g-slides"}],words:"slide sliding technique"},{id:"g6-f",instrument:ke,stage:6,title:"The E shape barre: F and F minor",summary:"Finger 1 across all six strings at fret 1.",why:"The barre chord is the biggest milestone in the first year of guitar. After this, every major and minor chord in every key is within reach.",blocks:[{kind:"text",text:`Take an E major chord and play it with fingers 2, 3 and 4. Now slide that shape up one fret and lay finger 1 flat across all the strings at fret 1. That is **F major**: the E shape barre. The root is on the low E string under finger 1.

Do the same with E minor and you get **F minor**.`},{kind:"chords",ids:["F-maj","F-m"]},{kind:"steps",items:["Roll finger 1 slightly onto its bony outside edge. The flat fleshy pad is softer and mutes strings.","Keep it close to the fret wire.","Thumb low behind the neck, roughly behind finger 2.","Do not squeeze with the thumb. Pull the guitar gently towards you with the arm, letting its weight do the pressing.","Pick each string. The G and B strings under the barre are the usual problem. Adjust the angle of finger 1 until they ring."]}],method:["Build up stamina gradually: hold it for 10 seconds, rest, repeat. Your hand will get stronger quickly. Never push through pain."],mistakes:["The B string dead because it falls into a crease of finger 1. Shift the finger slightly up or down.","Squeezing hard with the thumb."],ready:["My F barre chord rings on all six strings."],words:"f barre chord e shape barre f minor how to play barre chords"},{id:"g6-b",instrument:ke,stage:6,title:"The A shape barre: B and B minor",summary:"Root on the A string, barre at fret 2.",why:"With E and A shape barres together you can play every major and minor chord in two positions.",blocks:[{kind:"chords",ids:["B-m","B-maj"]},{kind:"text",text:"**B minor** is the A minor shape moved up and barred at fret 2. **B major** uses the A major shape: either fingers 2, 3 and 4 on fret 4, or a second, partial barre with finger 3 across the D, G and B strings while the high e is muted or barred by finger 1."}],words:"b minor barre a shape barre b major"},{id:"g6-movable",instrument:ke,stage:6,title:"Barre chords in every key",summary:"Combining the shapes with the note names you learnt.",why:"This is where note names pay off: any chord, anywhere.",blocks:[{kind:"text",text:`For a major or minor chord, find its root on the low E string and use the E shape there, or find it on the A string and use the A shape.

C major: C is at fret 8 on the low E, so E shape at fret 8; or fret 3 on the A string, so A shape at fret 3. Choose whichever is closest to the chord before it.`},{kind:"chords",ids:["C-maj","D-m","G-maj","E-m"],caption:"Open the chord pages to see every shape for each. The chips there show each barre position."},{kind:"progression",instrument:"guitar",chords:["C-maj","F-maj","G-maj","C-maj"],pattern:"2",bpm:70,caption:"C to F within one beat is the ready check for this stage."}],ready:["I can change from C to F within one beat at 70 bpm."],words:"movable chords barre chords any key"},{id:"g6-sevenths",instrument:ke,stage:6,title:"Open seventh chords",summary:"E7, A7, D7, G7, C7, B7 and their colours.",why:"Seventh chords are the sound of the blues and give extra pull to any progression.",blocks:[{kind:"chords",ids:["E-7","A-7","D-7","G-7","C-7","B-7"]},{kind:"chords",ids:["C-maj7","F-maj7","A-m7","E-m7","D-m7"],caption:"The major and minor sevenths: softer, jazzier colours."},{kind:"theory",id:"t-sevenths"}],words:"seventh chords e7 a7 d7 g7 b7 c7 dominant open"},{id:"g6-blues",instrument:ke,stage:6,title:"The twelve bar blues",summary:"Twelve bars of I, IV and V, in A and E.",why:"The twelve bar blues is the root of rock and roll, and the most common jam in the world. Learn it and you can play with almost anyone.",blocks:[{kind:"text",text:`Twelve bars, three chords, all usually dominant sevenths:

**I I I I, IV IV I I, V IV I V**

In A: A7 A7 A7 A7, D7 D7 A7 A7, E7 D7 A7 E7. The last bar, the V, is the turnaround that sends you back to the top.`},{kind:"progression",instrument:"guitar",chords:["A-7","A-7","A-7","A-7","D-7","D-7","A-7","A-7","E-7","D-7","A-7","E-7"],pattern:"2",bpm:90,caption:"Twelve bar blues in A."},{kind:"exercise",id:"g-shuffle"}],ready:["A twelve bar blues in A and in E without losing my place."],theory:["t-form"],words:"twelve bar blues 12 bar blues shuffle i iv v"},{id:"g6-sus",instrument:ke,stage:6,title:"Sus2, sus4 and add9",summary:"Colours that make simple progressions sound modern.",why:"These small changes to familiar shapes are a huge part of the sound of modern acoustic guitar.",blocks:[{kind:"chords",ids:["A-sus2","A-sus4","D-sus2","D-sus4","E-sus4","C-add9"]},{kind:"text",text:"Try moving between D, Dsus4, D and Dsus2 while strumming. One finger moves and the chord breathes. The same with A and E."},{kind:"progression",instrument:"guitar",chords:["D-maj","D-sus4","D-maj","D-sus2"],beats:2,pattern:"4",bpm:80}],words:"sus2 sus4 add9 suspended chords"},{id:"g7-fingers",instrument:ke,stage:7,title:"Playing with the fingers",summary:"p i m a, and the hand position for fingerstyle.",why:"Fingerstyle lets one guitar play bass, chords and melody at once.",blocks:[{kind:"text",text:`Picking hand fingers have names from Spanish: **p** thumb, **i** index, **m** middle, **a** ring. The little finger is rarely used.

The thumb plays the bass strings, E A D. The fingers play the treble strings, usually i on G, m on B, a on high e. Rest the hand lightly above the sound hole, wrist slightly arched, fingers relaxed and curved.

The thumb plucks forward, away from the hand. The fingers pluck up into the palm. Each finger stays on its string, ready.`},{kind:"exercise",id:"g-arp-pima"}],words:"fingerstyle fingerpicking pima thumb index middle ring"},{id:"g7-patterns",instrument:ke,stage:7,title:"Arpeggio patterns",summary:"Chords played one note at a time, in patterns.",why:"Arpeggio patterns turn ordinary chords into flowing accompaniments, and are the base of countless ballads.",blocks:[{kind:"progression",instrument:"guitar",chords:["C-maj","A-m","F-maj","G-maj"],pattern:"arp",bpm:70,caption:"A picked arpeggio over a four chord loop."},{kind:"progression",instrument:"guitar",chords:["A-m","E-maj","A-m","E-maj"],pattern:"arp",bpm:60}],method:["Hold each chord for the whole bar. The arpeggio only sounds right when every note keeps ringing into the next."],words:"arpeggio patterns fingerpicking patterns"},{id:"g7-travis",instrument:ke,stage:7,title:"Travis picking",summary:"An alternating thumb with melody on top.",why:"Travis picking is the engine of folk and country fingerstyle: it sounds like two guitarists at once.",blocks:[{kind:"exercise",id:"g-travis"},{kind:"progression",instrument:"guitar",chords:["C-maj","C-maj","G-maj","G-maj"],pattern:"travis",bpm:70,caption:"Travis pattern on C and G. This is the ready check."}],method:["Thumb alone first, for days if needed, until it runs without attention.","Add one finger note per bar, then two, then the full pattern.","If the thumb stumbles when the fingers enter, the thumb is not automatic yet. Go back a step."],ready:["A Travis pattern on C and G at 70 bpm for one minute."],words:"travis picking alternating bass thumb folk fingerstyle"},{id:"g7-hybrid",instrument:ke,stage:7,kind:"technique",title:"Hybrid picking",summary:"Pick and fingers together.",why:"Hybrid picking gives you the speed of the pick and the reach of the fingers, essential in country, funk and modern rock.",blocks:[{kind:"exercise",id:"g-hybrid"}],words:"hybrid picking chicken picking pick and fingers"},{id:"g8-bends",instrument:ke,stage:8,kind:"technique",title:"Bends",summary:"Pushing the string to raise the pitch, exactly.",why:"Bends are the voice of blues and rock guitar. Out of tune bends are also the most common thing that makes lead playing sound amateur.",blocks:[{kind:"exercise",id:"g-bends"}],method:["Always play the target note first, then bend to match it. Check with the tuner now and then."],ready:["A whole step bend lands in tune."],words:"string bending bends whole step half step"},{id:"g8-vibrato",instrument:ke,stage:8,kind:"technique",title:"Vibrato",summary:"Making long notes sing.",why:"A good vibrato is often the first thing that identifies a great player. It brings a single note to life.",blocks:[{kind:"exercise",id:"g-vibrato"}],words:"vibrato technique"},{id:"g8-shapes",instrument:ke,stage:8,title:"All five pentatonic shapes",summary:"Joining the boxes across the whole neck.",why:"Stuck in one box, every solo sounds the same. The five shapes connect into one map of the whole neck.",blocks:[{kind:"text",text:"The minor pentatonic has five shapes. Each one starts where the last one ends, and shape 5 leads back to shape 1 an octave higher. Learn them one at a time, each with its roots marked, then practise sliding between neighbouring shapes."},{kind:"fretboard",scale:{root:"A",type:"minpent",from:0,to:15},caption:"A minor pentatonic across the whole neck. Open the A minor pentatonic scale page to see each of the five positions on its own."},{kind:"theory",id:"t-scales"}],ready:["All five pentatonic shapes connected in one key."],words:"pentatonic five shapes positions connect across the neck"},{id:"g8-blues-scale",instrument:ke,stage:8,title:"The blues scale",summary:"Minor pentatonic plus the blue note.",why:"One extra note, the flat fifth, gives the pentatonic its unmistakably bluesy grit.",blocks:[{kind:"fretboard",scale:{root:"A",type:"blues",from:5,to:8},caption:"A blues scale. The extra note, E♭, sits between D and E."},{kind:"progression",instrument:"guitar",chords:["A-7","A-7","A-7","A-7","D-7","D-7","A-7","A-7","E-7","D-7","A-7","E-7"],pattern:"2",bpm:90,caption:"Backing for soloing: twelve bar blues in A."}],method:["Use the blue note as a passing note between D and E, rarely as a note to stop on."],words:"blues scale blue note flat five"},{id:"g8-double",instrument:ke,stage:8,kind:"technique",title:"Double stops and string skipping",summary:"Two notes at once, and jumping over strings.",why:"Double stops fatten lead lines; string skipping breaks you out of scale shapes into wider, more interesting intervals.",blocks:[{kind:"exercise",id:"g-doublestops"},{kind:"exercise",id:"g-skipping"}],words:"double stops string skipping"},{id:"g8-improv",instrument:ke,stage:8,title:"Improvising over a backing",summary:"How to make up a solo that sounds like music.",why:"Improvising is where all the scales and techniques turn into your own voice.",blocks:[{kind:"steps",items:["**Start with rhythm, not notes.** Use just two or three notes and play interesting rhythms with them. Most great solos are simple notes with strong rhythm.","**Leave space.** Play a short phrase, then rest as long as the phrase lasted. Like speaking in sentences.","**Call and response.** Play a phrase, then answer it with a variation.","**Land on chord tones.** When the chord changes, aim for its root or third. In the blues, land on A over A7, on D over D7.","**Repeat yourself.** Repeating a good phrase sounds intentional. Random new notes sound lost."]},{kind:"progression",instrument:"guitar",chords:["A-m","A-m","D-m","D-m","A-m","A-m","E-7","E-7"],pattern:"1",bpm:80,caption:"A minor backing. Solo with A minor pentatonic."},{kind:"progression",instrument:"guitar",chords:["G-maj","C-maj","G-maj","D-maj"],pattern:"2",bpm:90,caption:"A major backing in G. Solo with G major pentatonic: the E minor pentatonic shapes."}],ready:["I can improvise for two minutes over a twelve bar blues without losing my place."],words:"improvisation soloing improvise backing track lead guitar phrasing"},{id:"g9-major",instrument:ke,stage:9,title:"The major scale on the neck",summary:"Seven notes, three per string, across the neck.",why:"The major scale is the parent of all the harmony you play. On the neck it links every chord shape you know.",blocks:[{kind:"fretboard",scale:{root:"G",type:"major",from:0,to:12},caption:"G major across the first twelve frets."},{kind:"exercise",id:"g-sync-3nps"},{kind:"text",text:"The three notes per string exercise from stage 4 was already part of a scale. Open the G major scale page to step through each position."}],words:"major scale guitar three notes per string positions"},{id:"g9-minor",instrument:ke,stage:9,title:"Natural and harmonic minor",summary:"Minor scales across the neck.",why:"Minor key melodies and solos need the full minor scales, not just the pentatonic.",blocks:[{kind:"fretboard",scale:{root:"A",type:"minor",from:0,to:12},caption:"A natural minor."},{kind:"fretboard",scale:{root:"A",type:"harmonic",from:0,to:12},caption:"A harmonic minor, with G♯."},{kind:"progression",instrument:"guitar",chords:["A-m","D-m","E-7","A-m"],pattern:"3",bpm:80,caption:"Use harmonic minor over the E7."},{kind:"theory",id:"t-minor"}],words:"natural minor harmonic minor guitar scale"},{id:"g9-caged",instrument:ke,stage:9,title:"The CAGED system",summary:"Five chord shapes that map the whole neck.",why:"CAGED shows how the open chord shapes you learnt first link together into one continuous picture of any chord, all the way up the neck.",blocks:[{kind:"text",text:`The open chords C, A, G, E and D are not just five chords. Each is a shape that can be moved up the neck with a barre. Played in that order, C A G E D, the five shapes of one chord join end to end and cover the whole fretboard.

Below are the five shapes of a C major chord. Notice how the roots of one shape are shared with the next.`},...i2.map(s=>({kind:"fretboard",from:s.from,to:s.to,marks:s.marks,caption:`C major, ${s.name}.`}))],method:["Pick one chord a week, find it in all five shapes, then play the scale around each shape. That is the whole system."],ready:["C major in all five CAGED positions."],words:"caged system caged chord shapes fretboard"},{id:"g9-sevenths",instrument:ke,stage:9,title:"Movable seventh chord shapes",summary:"maj7, m7, 7 and m7♭5 with roots on the E and A strings.",why:"These four shapes let you play jazz, soul and bossa nova harmony in any key.",blocks:[{kind:"chords",ids:["G-maj7","G-m7","G-7","G-m7b5"],caption:"Open each one to see the E shape and A shape versions."},{kind:"chords",ids:["C-maj7","C-m7","C-7","C-m7b5"]}],words:"seventh chord shapes maj7 m7 dominant 7 half diminished movable"},{id:"g9-ii-v-i",instrument:ke,stage:9,title:"The ii V I",summary:"The most important progression in jazz.",why:"ii V I is how jazz, and a lot of soul and pop, moves from one key to the next. Learn it in a few keys and you will hear it everywhere.",blocks:[{kind:"progression",instrument:"guitar",chords:["D-m7","G-7","C-maj7","C-maj7"],pattern:"1",bpm:90,caption:"ii V I in C."},{kind:"progression",instrument:"guitar",chords:["A-m7","D-7","G-maj7","G-maj7"],pattern:"1",bpm:90,caption:"ii V I in G."},{kind:"progression",instrument:"guitar",chords:["E-m7","A-7","D-maj7","D-maj7"],pattern:"1",bpm:90,caption:"ii V I in D."},{kind:"diatonic",key:"C",sevenths:!0}],ready:["A ii V I in three different keys with movable shapes."],words:"ii v i two five one jazz progression"},{id:"g9-capo",instrument:ke,stage:9,title:"Using a capo and transposing",summary:"Open shapes in any key.",why:"A capo lets you keep the ringing open chord sound in keys that would otherwise need barre chords.",blocks:[{kind:"text",text:`A capo at fret 2 makes the G shape sound as A, C as D, D as E, Em as F♯m. Each fret raises everything by a semitone.

To play a song in E♭ using easy shapes: E♭ is three semitones above C, so put the capo at fret 3 and play it in C shapes. Or one semitone above D: capo 1, D shapes.`},{kind:"theory",id:"t-transpose"}],ready:["I can transpose a progression to any key, with or without a capo."],words:"capo transpose transposing key change"},{id:"g9-sync",instrument:ke,stage:9,title:"Syncopated strumming and dynamics",summary:"Accents off the beat, and playing loud and soft.",why:"Syncopation is what makes strumming groove. Dynamics make it feel alive rather than mechanical.",blocks:[{kind:"text",text:`**Pattern 5** misses the strum on beat 3, so the upstroke on the and of 2 pushes across the bar. **Pattern 6** strums only on the ands, the offbeat skank of reggae and ska. **Pattern 7** is a sixteenth note funk pattern: keep the hand moving twice as fast and hit only some strokes.

Dynamics: play a whole verse soft, near the neck, with fewer strings, then the chorus loud, nearer the bridge, with all six strings.`},{kind:"progression",instrument:"guitar",chords:["G-maj","D-maj","E-m","C-maj"],pattern:"5",bpm:90},{kind:"progression",instrument:"guitar",chords:["A-m","D-maj","A-m","D-maj"],pattern:"6",bpm:80},{kind:"progression",instrument:"guitar",chords:["E-m7","A-7","E-m7","A-7"],pattern:"7",bpm:90}],words:"syncopation strumming dynamics reggae funk sixteenth strumming"},{id:"g10-modes",instrument:ke,stage:10,title:"The modes on the neck",summary:"Seven colours from one set of notes.",why:"Modes let you choose a mood precisely when improvising: Dorian for soulful minor, Mixolydian for bluesy major, Lydian for floating.",blocks:[{kind:"fretboard",scale:{root:"D",type:"dorian",from:3,to:8},caption:"D Dorian."},{kind:"progression",instrument:"guitar",chords:["D-m7","G-7","D-m7","G-7"],pattern:"7",bpm:90,caption:"A Dorian vamp. Solo with D Dorian and lean on the B."},{kind:"fretboard",scale:{root:"A",type:"mixolydian",from:3,to:8},caption:"A Mixolydian."},{kind:"progression",instrument:"guitar",chords:["A-maj","G-maj","D-maj","A-maj"],pattern:"2",bpm:100,caption:"A Mixolydian rock progression: the G chord comes from the flat seventh."},{kind:"theory",id:"t-modes"}],ready:["I can play the seven modes of one key and hear the difference between them."],words:"modes dorian mixolydian lydian phrygian guitar"},{id:"g10-economy",instrument:ke,stage:10,kind:"technique",title:"Economy picking",summary:"Letting the pick continue in the same direction across strings.",why:"Economy picking saves motion when crossing strings, making fast scale runs smoother.",blocks:[{kind:"exercise",id:"g-economy"}],words:"economy picking"},{id:"g10-sweep",instrument:ke,stage:10,kind:"technique",title:"Sweep picking",summary:"Arpeggios with one continuous pick motion.",why:"Sweep picking plays wide arpeggios at speeds alternate picking cannot reach.",blocks:[{kind:"exercise",id:"g-sweep3"},{kind:"text",text:"Once the three string shape is clean, extend it to five strings: start on the A string at fret 12 (A), D string 14 (E), G string 14 (A), B string 13 (C), high e 12 (E), and back. The principle is identical."}],ready:["A three string arpeggio swept cleanly at 80 bpm in triplets."],words:"sweep picking arpeggios"},{id:"g10-tapping",instrument:ke,stage:10,kind:"technique",title:"Tapping",summary:"The picking hand joins the fretboard.",why:"Tapping lets you play wide intervals and fast legato patterns impossible with one hand.",blocks:[{kind:"exercise",id:"g-tapping"}],words:"tapping two hand tapping"},{id:"g10-harmonics",instrument:ke,stage:10,kind:"technique",title:"Natural and pinch harmonics",summary:"Bell tones and squeals.",why:"Harmonics add shimmer to acoustic playing and the famous squeal to rock lead.",blocks:[{kind:"exercise",id:"g-harmonics"}],words:"harmonics natural harmonics pinch harmonics"},{id:"g10-speed",instrument:ke,stage:10,title:"Sixteenth notes at speed",summary:"Putting the synchronisation work to its final test.",why:"Every technique you have learnt meets here: clean, even, fast playing with both hands locked.",blocks:[{kind:"exercise",id:"g-chromatic8"},{kind:"text",text:"Play the chromatic exercise and the three notes per string exercise with the metronome at half your target tempo, counting each click as a half beat, so you are playing sixteenths. Use the ladder. Bursts above your speed once a week."},{kind:"exercise",id:"g-sync-3nps"}],words:"speed sixteenth notes fast picking shred"},{id:"g10-folk",instrument:ke,stage:10,title:"Style: folk",summary:"Open chords, capo, fingerpicking and singable melodies.",why:"Folk guitar is about supporting a song: steady rhythm, ringing open strings and simple harmony.",blocks:[{kind:"text",text:"Folk guitar leans on open chords in G, C, D and their relatives, often with a capo, and on either the folk strum or Travis picking. The bass note often alternates between the root and another chord tone."},{kind:"progression",instrument:"guitar",chords:["G-maj","C-maj","G-maj","D-maj","E-m","C-maj","D-maj","G-maj"],pattern:"travis",bpm:80}],words:"folk guitar style"},{id:"g10-blues",instrument:ke,stage:10,title:"Style: blues",summary:"Shuffle rhythm, sevenths, bends and the blues scale.",why:"Blues is the root of rock, soul and much more. Its language is in every guitar style since.",blocks:[{kind:"exercise",id:"g-shuffle"},{kind:"progression",instrument:"guitar",chords:["E-7","E-7","E-7","E-7","A-7","A-7","E-7","E-7","B-7","A-7","E-7","B-7"],pattern:"2",bpm:90,caption:"Twelve bar blues in E. Solo with the E blues scale at fret 0 or 12."}],words:"blues guitar style shuffle"},{id:"g10-rock",instrument:ke,stage:10,title:"Style: rock",summary:"Power chords, palm muting and pentatonic leads.",why:"Rock combines the techniques of stage 4 and stage 8 into its own powerful sound.",blocks:[{kind:"exercise",id:"g-palm-mute"},{kind:"exercise",id:"g-power-move"},{kind:"progression",instrument:"guitar",chords:["E-5","G-5","A-5","C-5"],pattern:"4",bpm:110,caption:"A rock progression with power chords. Solo over it with E minor pentatonic."}],words:"rock guitar style power chords"},{id:"g10-classical",instrument:ke,stage:10,title:"Style: classical",summary:"Rest strokes, free strokes and independent voices.",why:"Classical technique gives the finest control of tone of any guitar style.",blocks:[{kind:"text",text:`Classical guitarists play with the fingertips and nails, sitting with the guitar on the left leg raised by a footstool.

A **free stroke** plucks the string and the finger moves freely into the air above the next string. A **rest stroke** plucks and comes to rest on the next string, giving a fuller, louder tone for melody.

Much classical music has two voices: a bass with the thumb and a melody with the fingers, each sustained for its full length.`},{kind:"exercise",id:"g-arp-pima"}],words:"classical guitar style rest stroke free stroke"},{id:"g10-flamenco",instrument:ke,stage:10,title:"Style: flamenco basics",summary:"The rasgueado and the Phrygian cadence.",why:"Flamenco has one of the most distinctive sounds of any guitar music, built on a dark scale and explosive rhythm.",blocks:[{kind:"text",text:`The heart of the flamenco sound is the **Phrygian cadence**: Am, G, F, E, with the final E chord sounding like home. It comes from the Phrygian mode on E.

The **rasgueado** is the rolling strum: fingers flicked out one after another across the strings.`},{kind:"exercise",id:"g-rasgueado"},{kind:"progression",instrument:"guitar",chords:["A-m","G-maj","F-maj","E-maj"],pattern:"7",bpm:100,caption:"The Phrygian cadence. Notice how E feels like the destination."}],words:"flamenco rasgueado phrygian cadence andalusian"}],Xe="piano",l2=[{id:"p5-inversions",instrument:Xe,stage:5,title:"Triad inversions",summary:"The same three notes, a different one at the bottom.",why:"Inversions let your hand move between chords by a key or two instead of jumping, which sounds smoother and is far easier to play.",blocks:[{kind:"text",text:`**Root position**: the root at the bottom, C E G.
**First inversion**: the third at the bottom, E G C.
**Second inversion**: the fifth at the bottom, G C E.

All three are C major. Right hand fingering: root position 1 3 5, first inversion 1 2 5, second inversion 1 3 5.`},{kind:"pianoChords",ids:["C-maj","F-maj","G-maj","A-m"],caption:"Open any chord page and step through the inversion chips to see and hear each one."},{kind:"theory",id:"t-chords"}],words:"inversions first inversion second inversion triads"},{id:"p5-voice",instrument:Xe,stage:5,title:"Voice leading between chords",summary:"Choosing inversions so the hand barely moves.",why:"This is the secret of pianists who seem to play chords effortlessly. Each note moves to the nearest note of the next chord.",blocks:[{kind:"text",text:`Play C major in root position: C E G. To move to F, do not jump to F A C. Instead keep C, move E up to F and G up to A: **C F A**, F in second inversion. Then to G: B D G, G in first inversion. Each finger moves by a key or two.

The backing below always picks the nearest inversion automatically. Watch the keys as it plays.`},{kind:"progression",instrument:"piano",chords:["C-maj","F-maj","G-maj","C-maj"],pattern:"block",bpm:70},{kind:"progression",instrument:"piano",chords:["G-maj","C-maj","D-maj","G-maj"],pattern:"pulse",bpm:70,caption:"The same in G."},{kind:"progression",instrument:"piano",chords:["F-maj","Bb-maj","C-maj","F-maj"],pattern:"pulse",bpm:70,caption:"And in F."}],ready:["I IV V I in C, G and F using inversions so no right hand finger moves more than two keys."],words:"voice leading smooth chord changes inversions"},{id:"p5-pedal",instrument:Xe,stage:5,kind:"technique",title:"The sustain pedal",summary:"What it does, and when to change it.",why:"The pedal gives the piano its singing, connected sound. Used badly it turns everything to mush, which is why the timing of the change matters so much.",blocks:[{kind:"text",text:`The right pedal lifts all the dampers off the strings, so notes keep ringing after you release the keys.

**Legato pedalling**, also called syncopated pedalling, is the standard technique: play the new chord, and only then lift the pedal and press it down again straight away. The new chord bridges the moment the pedal is up, so there is no gap, and the old harmony is cleared, so there is no blur.

Change the pedal every time the harmony changes. Use the heel as a pivot on the floor and press with the ball of the foot.`},{kind:"exercise",id:"p-pedal"},{kind:"tip",title:"Try it with sound",text:"The Keyboard tool in Practice has a sustain pedal button. Hold a chord, press the pedal, release the keys, and hear them keep ringing."}],mistakes:["Lifting the pedal at the same moment as playing the new chord, which leaves a gap.","Changing too late, which blurs two chords together.","Stamping the pedal noisily. Keep the foot in contact with it."],ready:["Clean pedal changes, with no gap and no blur."],words:"sustain pedal damper pedal legato pedalling syncopated pedalling"},{id:"p5-scales",instrument:Xe,stage:5,title:"Major scales to four sharps and four flats",summary:"G D A E, and F B♭ E♭ A♭.",why:"These keys cover the great majority of music you will play.",blocks:[{kind:"text",text:"The sharp keys G, D, A and E all use the same fingering as C. The flat keys each have their own, because the thumb must stay on white keys. Open each scale in the piano library for its full fingering, written out for both hands."},{kind:"keyboard",scale:{root:"D",type:"major"},caption:"D major: F♯ and C♯."},{kind:"keyboard",scale:{root:"Bb",type:"major"},caption:"B♭ major: the right hand starts on finger 4."},{kind:"keyboard",scale:{root:"Eb",type:"major"},caption:"E♭ major."}],ready:["Every major scale up to four sharps and four flats, hands separately."],words:"major scales fingering g d a e f b flat e flat a flat"},{id:"p5-sight",instrument:Xe,stage:5,title:"Sight reading, level 3",summary:"Both hands on the grand staff, simple rhythms.",why:"Reading two staves at once is the real test of sight reading. Start simple and read a little every day.",blocks:[{kind:"staff",clef:"grand",time:"4/4",music:"E4q D4q C4q D4q | E4q E4q E4h | D4q D4q E4q D4q | C4w // C3w | G2w | G2w | C3w",caption:"Melody over long bass notes.",play:!0},{kind:"staff",clef:"grand",time:"3/4",music:"G4h E4q | F4h D4q | E4q F4q G4q | C4h. // C3h. | G2h. | C3q E3q G3q | C3h.",caption:"In 3/4.",play:!0},{kind:"staff",clef:"grand",key:"G",time:"4/4",music:"B4q A4q G4q A4q | B4h B4h | A4q B4q A4q G4q | G4w // G2h D3h | G2h D3h | D3h D3h | G2w",caption:"In G major.",play:!0}],method:["Before playing: key signature, time signature, first note in each hand, and any repeated patterns. Ten seconds of looking saves a minute of stumbling."],words:"sight reading level 3 grand staff both hands"},{id:"p6-minor",instrument:Xe,stage:6,title:"Minor scales, three forms",summary:"A, E and D minor: natural, harmonic and melodic.",why:"Minor scales unlock minor key music, and their fingering is the same for all three forms.",blocks:[{kind:"keyboard",scale:{root:"A",type:"minor"},caption:"A natural minor."},{kind:"keyboard",scale:{root:"A",type:"harmonic"},caption:"A harmonic minor."},{kind:"keyboard",scale:{root:"A",type:"melodic"},caption:"A melodic minor, going up."},{kind:"theory",id:"t-minor"}],ready:["A, E and D minor in all three forms, hands separately, at 72 bpm."],words:"minor scales natural harmonic melodic piano fingering"},{id:"p6-arps",instrument:Xe,stage:6,title:"Arpeggios",summary:"Broken chords across the keyboard.",why:"Arpeggios train the hand to stretch and cross smoothly, and are everywhere in piano music.",blocks:[{kind:"exercise",id:"p-arp-c"},{kind:"text",text:`Fingering for white key roots: right hand 1 2 3 5 for one octave, or 1 2 3 1 2 3 5 over two. Left hand 5 4 2 1, crossing finger 4 over the thumb for a second octave. Some teachers use 5 3 2 1 for D, E and A major in the left hand; use whichever keeps your hand relaxed.

For black key roots, start with finger 2 in the right hand and keep the thumbs on white keys.`}],ready:["One octave arpeggios of C, G, F, A minor, E minor and D minor."],words:"arpeggios broken chords arpeggio fingering"},{id:"p6-walking",instrument:Xe,stage:6,title:"Walking bass",summary:"A left hand that moves on every beat.",why:"Walking bass gives blues and jazz piano their forward motion, and builds a strong, independent left hand.",blocks:[{kind:"exercise",id:"p-walking"}],words:"walking bass left hand jazz blues"},{id:"p6-octaves",instrument:Xe,stage:6,kind:"technique",title:"Left hand octaves",summary:"A strong bass with fingers 5 and 1.",why:"Octaves give the bass power in pop ballads, rock and classical music alike.",blocks:[{kind:"exercise",id:"p-octaves"}],words:"octaves left hand bass"},{id:"p6-accomp",instrument:Xe,stage:6,title:"Accompaniment patterns",summary:"Block, pulse, broken, Alberti and pop.",why:"Knowing a handful of patterns lets you accompany almost any song from a chord chart.",blocks:[{kind:"text",text:"Here is one progression with every pattern. Change the pattern with the chips under the player and listen to how the same chords change character."},{kind:"progression",instrument:"piano",chords:["A-m","F-maj","C-maj","G-maj"],pattern:"broken",bpm:72}],words:"accompaniment patterns left hand patterns piano"},{id:"p6-ornaments",instrument:Xe,stage:6,title:"Trills and ornaments",summary:"Trills, mordents and turns.",why:"Ornaments decorate a melody. They appear in almost all classical music and in a lot of gospel and jazz.",blocks:[{kind:"text",text:`A **trill**, marked tr, alternates rapidly between the written note and the note above.
A **mordent** is a quick single flick: note, note above, note.
A **turn** circles the note: the note above, the note, the note below, the note.

All of them must be light and fit inside the beat without disturbing the rhythm.`},{kind:"exercise",id:"p-trill"}],ready:["An even trill for four beats with fingers 2 and 3."],words:"trills ornaments mordent turn"},{id:"p8-sevenths",instrument:Xe,stage:8,title:"Seventh chords on the piano",summary:"Four note chords and their inversions.",why:"Sevenths are the everyday harmony of jazz, soul, gospel and modern pop.",blocks:[{kind:"pianoChords",ids:["C-maj7","C-7","C-m7","C-m7b5","C-dim7"]},{kind:"diatonic",key:"C",sevenths:!0},{kind:"theory",id:"t-sevenths"}],words:"seventh chords piano maj7 dominant minor seventh"},{id:"p8-symbols",instrument:Xe,stage:8,title:"Reading chord symbols fast",summary:"From symbol to hands in three seconds.",why:"Lead sheets give only a melody and chord symbols. Turning symbols into chords instantly is the key skill of the pop and jazz pianist.",blocks:[{kind:"theory",id:"t-symbols"},{kind:"drill",id:"symbols"}],ready:["Any chord symbol from the drill played within three seconds."],words:"chord symbols lead sheet reading"},{id:"p8-pop",instrument:Xe,stage:8,title:"Pop accompaniment",summary:"Three patterns for any four chord song.",why:"With these patterns you can accompany an enormous number of songs from just the chord names.",blocks:[{kind:"progression",instrument:"piano",chords:["C-maj","G-maj","A-m","F-maj"],pattern:"pop",bpm:76,caption:"The pop ballad pattern."},{kind:"progression",instrument:"piano",chords:["C-maj","G-maj","A-m","F-maj"],pattern:"pulse",bpm:96,caption:"Driving quarter notes."},{kind:"progression",instrument:"piano",chords:["C-maj","G-maj","A-m","F-maj"],pattern:"broken",bpm:72,caption:"Flowing broken chords."}],ready:["A four chord progression accompanied in three different pop patterns."],words:"pop piano accompaniment patterns ballad"},{id:"p8-blues",instrument:Xe,stage:8,title:"Blues piano",summary:"Twelve bars with a shuffling left hand.",why:"Blues is the foundation of boogie woogie, rock and roll and jazz piano.",blocks:[{kind:"progression",instrument:"piano",chords:["C-7","C-7","C-7","C-7","F-7","F-7","C-7","C-7","G-7","F-7","C-7","G-7"],pattern:"shuffle",bpm:96,caption:"Twelve bar blues in C with a shuffle bass."},{kind:"text",text:"The left hand plays root and fifth, then root and sixth, in a long short swung rhythm. Keep it steady and let the right hand play chords on the offbeats, or improvise with the C blues scale: C E♭ F G♭ G B♭."},{kind:"keyboard",scale:{root:"C",type:"blues"},caption:"C blues scale."}],ready:["A twelve bar blues with a left hand shuffle."],words:"blues piano twelve bar shuffle boogie"},{id:"p8-shells",instrument:Xe,stage:8,title:"Jazz shell voicings",summary:"Root with the third or seventh: the jazz left hand.",why:"Shells give the essential sound of a chord with just two notes, leaving the right hand free for melody.",blocks:[{kind:"exercise",id:"p-shells"}],words:"shell voicings jazz piano left hand"},{id:"p8-251",instrument:Xe,stage:8,title:"ii V I",summary:"The jazz progression, in several keys.",why:"ii V I is the building block of jazz standards. Practising it in all keys is how jazz pianists learn harmony.",blocks:[{kind:"progression",instrument:"piano",chords:["D-m7","G-7","C-maj7","C-maj7"],pattern:"block",bpm:80,caption:"ii V I in C."},{kind:"progression",instrument:"piano",chords:["G-m7","C-7","F-maj7","F-maj7"],pattern:"block",bpm:80,caption:"ii V I in F."},{kind:"progression",instrument:"piano",chords:["C-m7","F-7","Bb-maj7","Bb-maj7"],pattern:"block",bpm:80,caption:"ii V I in B♭."}],words:"ii v i two five one jazz piano"},{id:"p9-scales",instrument:Xe,stage:9,title:"All scales, hands together",summary:"Major and minor, two to four octaves.",why:"Scales hands together over several octaves are the backbone of technique: evenness, speed and control.",blocks:[{kind:"text",text:`Every scale in the piano library has its fingering written out for both hands, over one or two octaves. Hands together, the thumbs often cross at different moments, which is the main difficulty. Find where the thumbs play together, the meeting points, and use them as anchors.

Build to four octaves by repeating the octave pattern; the scale pages show exactly which finger starts each new octave.`},{kind:"keyboard",scale:{root:"C",type:"major",octaves:2},caption:"C major, two octaves."},{kind:"metronome",bpm:88,sig:"4/4",sub:2}],method:["Practise the circle of fifths order: C, G, D, A, E, B, then the flat keys. One major and its relative minor each day."],ready:["Any major or minor scale two octaves hands together at 88 bpm in eighth notes."],words:"scales hands together two octaves four octaves"},{id:"p9-chromatic",instrument:Xe,stage:9,title:"The chromatic scale",summary:"Every key, with a fixed fingering.",why:"The chromatic scale is a pure technical exercise, and appears in countless runs and passages.",blocks:[{kind:"exercise",id:"p-chromatic"}],ready:["The chromatic scale two octaves hands together with the right fingering."],words:"chromatic scale fingering"},{id:"p9-thirds",instrument:Xe,stage:9,kind:"technique",title:"Scales in thirds and sixths",summary:"Double notes in one hand.",why:"Double notes build finger independence within one hand and appear throughout romantic piano music.",blocks:[{kind:"exercise",id:"p-thirds"}],words:"thirds sixths double notes"},{id:"p9-crossing",instrument:Xe,stage:9,kind:"technique",title:"Hand crossing",summary:"One hand travelling over the other.",why:"Crossing hands appears in many pieces and trains spatial awareness of the keyboard.",blocks:[{kind:"exercise",id:"p-crossing"}],words:"hand crossing cross hands"},{id:"p9-studies",instrument:Xe,stage:9,title:"Exercises in the style of Hanon and Czerny",summary:"Daily technical work.",why:"A few minutes of technical patterns each day builds even, strong, independent fingers faster than pieces alone.",blocks:[{kind:"exercise",id:"p-pattern"},{kind:"exercise",id:"p-study"}],method:["Five to ten minutes at the start of practice is plenty. Always with the metronome, always even, never forced."],ready:["A Hanon style exercise at 100 bpm in sixteenths with even tone."],words:"hanon czerny technical exercises finger exercises studies"},{id:"p9-pedals",instrument:Xe,stage:9,kind:"technique",title:"The soft and sostenuto pedals",summary:"The left and middle pedals.",why:"The other two pedals complete your control of colour.",blocks:[{kind:"text",text:`The **soft pedal**, on the left, shifts the hammers so they strike fewer strings, or closer to them on an upright. The sound becomes softer and more veiled. Marked una corda.

The **sostenuto pedal**, in the middle on grand pianos and some uprights, sustains only the notes being held when it is pressed. Play a low bass note, press the sostenuto, and the bass rings on while everything else stays clean. On many uprights the middle pedal is instead a practice mute.`}],words:"soft pedal una corda sostenuto pedal middle pedal"},{id:"p10-extended",instrument:Xe,stage:10,title:"Ninths and extended chords",summary:"9, 11 and 13, and which notes to leave out.",why:"Extended chords give the rich sound of jazz, neo soul and film music.",blocks:[{kind:"pianoChords",ids:["C-9","C-maj9","C-m9","C-m11","C-13"]},{kind:"text",text:"Ten fingers cannot always play six notes comfortably, and they would sound muddy anyway. Leave out the fifth first, then the root if a bass player has it. Keep the third and seventh: they define the chord."}],words:"ninth chords extended chords 9 11 13"},{id:"p10-rootless",instrument:Xe,stage:10,title:"Rootless voicings",summary:"The modern jazz left hand.",why:"Rootless voicings are how jazz pianists sound full and modern while leaving the bass to the bass player.",blocks:[{kind:"text",text:"A rootless voicing plays the third and seventh at the bottom, with the ninth and sometimes the thirteenth on top. Dm9 becomes F A C E; G13 becomes F A B E. Notice how little moves between them. Open any 9, m9, maj9 or 13 chord page and choose the rootless voicing chip."},{kind:"pianoChords",ids:["D-m9","G-13","C-maj9"]}],ready:["Rootless voicings through a ii V I in all twelve keys."],words:"rootless voicings jazz piano bill evans"},{id:"p10-four-three",instrument:Xe,stage:10,title:"Four against three",summary:"The next polyrhythm.",why:"Four against three appears in Chopin and much romantic music, and trains the deepest level of hand independence.",blocks:[{kind:"polyrhythm",a:4,b:3,bpm:40},{kind:"exercise",id:"p-four-three"}],ready:["Four against three for one minute."],words:"four against three polyrhythm 4 against 3"},{id:"p10-sight",i
